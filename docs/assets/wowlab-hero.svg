<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">wowlab</title>
  <desc id="d">wowlab: your World of Warcraft install, understood, snapshotted and safely undoable. Local only.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1f"/>
      <stop offset="0.55" stop-color="#141a33"/>
      <stop offset="1" stop-color="#231a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#f3c969" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f3c969" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c2"/>
      <stop offset="0.45" stop-color="#f3c969"/>
      <stop offset="1" stop-color="#b8862b"/>
    </linearGradient>
    <linearGradient id="arcane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ec8ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8fd8ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5ec8ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#glow)"/>
  <!-- rune circle -->
  <g transform="translate(600 170)" fill="none" stroke="#f3c969" stroke-opacity="0.18">
    <circle r="150" stroke-width="1.5"/>
    <circle r="132" stroke-width="1" stroke-dasharray="2 10"/>
    <circle r="112" stroke-width="1"/>
    <g stroke-width="1.2">
      <path d="M0 -150 L0 -112"/><path d="M0 150 L0 112"/>
      <path d="M-150 0 L-112 0"/><path d="M150 0 L112 0"/>
      <path d="M-106 -106 L-79 -79"/><path d="M106 106 L79 79"/>
      <path d="M-106 106 L-79 79"/><path d="M106 -106 L79 -79"/>
    </g>
  </g>
  <!-- stars -->
  <g fill="#cfe9ff">
    <circle cx="96" cy="64" r="1.4" opacity="0.8"/><circle cx="182" cy="248" r="1.1" opacity="0.6"/>
    <circle cx="310" cy="96" r="1.2" opacity="0.7"/><circle cx="1010" cy="70" r="1.5" opacity="0.8"/>
    <circle cx="1112" cy="210" r="1.1" opacity="0.6"/><circle cx="905" cy="290" r="1.2" opacity="0.5"/>
    <circle cx="240" cy="310" r="1" opacity="0.5"/><circle cx="1060" cy="318" r="1" opacity="0.5"/>
  </g>
  <!-- title -->
  <text x="600" y="178" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="700" letter-spacing="6" fill="url(#gold)" stroke="#3a2a0c" stroke-width="1.5">wowlab</text>
  <rect x="380" y="204" width="440" height="2" fill="url(#arcane)"/>
  <text x="600" y="246" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#e9dfc6">Your Warcraft install, understood.</text>
  <text x="600" y="286" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" letter-spacing="2.5" fill="#8fa3c7">EXPLAIN · SNAPSHOT · UNDO · LOCAL ONLY</text>
</svg>
