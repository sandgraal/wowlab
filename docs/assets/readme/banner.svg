<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Bronze: a persistent character workbench for World of Warcraft">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c140a"/>
      <stop offset="1" stop-color="#060504"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="60%">
      <stop offset="0" stop-color="#9a6430" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#3d2611" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="0.42" stop-color="#f3cb63"/>
      <stop offset="0.58" stop-color="#c98a2e"/>
      <stop offset="1" stop-color="#7d5124"/>
    </linearGradient>
    <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c98a2e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f3cb63"/>
      <stop offset="1" stop-color="#c98a2e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d386"/>
      <stop offset="1" stop-color="#c98a2e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.9"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="topBulb"><path d="M112,112 L188,112 Q188,168 150,196 Q112,168 112,112 Z"/></clipPath>
    <clipPath id="botBulb"><path d="M150,204 Q188,232 188,288 L112,288 Q112,232 150,204 Z"/></clipPath>
  </defs>
  <style>
    .serif { font-family: Georgia, "Palatino Linotype", "Book Antiqua", "Times New Roman", serif; }
    .mono  { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .mote  { animation: drift 10s ease-in-out infinite; }
    .m2 { animation-delay: -2.5s; } .m3 { animation-delay: -5s; } .m4 { animation-delay: -7.5s; } .m5 { animation-delay: -1.2s; } .m6 { animation-delay: -6.1s; }
    @keyframes drift { 0% { transform: translateY(0px); opacity: 0; } 15% { opacity: 0.9; } 85% { opacity: 0.5; } 100% { transform: translateY(-90px); opacity: 0; } }
    .pulse { animation: pulse 5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }
    .spin { transform-origin: 150px 200px; animation: spin 60s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- ornate frame -->
  <rect x="14" y="14" width="1172" height="372" rx="8" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <rect x="23" y="23" width="1154" height="354" rx="5" fill="none" stroke="#6b4a1e" stroke-width="1" opacity="0.9"/>
  <g fill="url(#gold)" stroke="#3a2510" stroke-width="1">
    <path d="M14,14 l34,0 l-8,8 l-18,0 l0,18 l-8,8 z"/>
    <path d="M1186,14 l-34,0 l8,8 l18,0 l0,18 l8,8 z"/>
    <path d="M14,386 l34,0 l-8,-8 l-18,0 l0,-18 l-8,-8 z"/>
    <path d="M1186,386 l-34,0 l8,-8 l18,0 l0,-18 l8,-8 z"/>
  </g>

  <!-- left: bronze hourglass on a slowly turning rune ring -->
  <g class="spin" opacity="0.5">
    <circle cx="150" cy="200" r="118" fill="none" stroke="#c98a2e" stroke-width="1.5" stroke-dasharray="6 10"/>
    <circle cx="150" cy="200" r="104" fill="none" stroke="#7d5124" stroke-width="1" stroke-dasharray="2 14"/>
    <g fill="#f3cb63">
      <polygon points="150,76 155,82 150,88 145,82"/>
      <polygon points="150,312 155,318 150,324 145,318"/>
      <polygon points="26,200 32,205 38,200 32,195"/>
      <polygon points="262,200 268,205 274,200 268,195"/>
    </g>
  </g>
  <circle cx="150" cy="200" r="86" fill="#000" opacity="0.35"/>
  <g filter="url(#shadow)">
    <rect x="102" y="102" width="96" height="10" rx="3" fill="url(#gold)"/>
    <rect x="102" y="288" width="96" height="10" rx="3" fill="url(#gold)"/>
    <path d="M112,112 L188,112 Q188,168 150,196 Q112,168 112,112 Z" fill="#0a0806" stroke="#e0a458" stroke-width="2"/>
    <path d="M150,204 Q188,232 188,288 L112,288 Q112,232 150,204 Z" fill="#0a0806" stroke="#e0a458" stroke-width="2"/>
    <rect x="104" y="108" width="6" height="184" fill="#7d5124"/>
    <rect x="190" y="108" width="6" height="184" fill="#7d5124"/>
  </g>
  <g clip-path="url(#topBulb)">
    <rect x="112" y="140" width="76" height="70" fill="url(#sand)">
      <animate attributeName="y" values="140;198;140" dur="14s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g clip-path="url(#botBulb)">
    <rect x="112" y="288" width="76" height="70" fill="url(#sand)">
      <animate attributeName="y" values="288;236;288" dur="14s" repeatCount="indefinite"/>
    </rect>
  </g>
  <line x1="150" y1="198" x2="150" y2="286" stroke="#f6d386" stroke-width="2" stroke-dasharray="3 5" class="pulse">
    <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- drifting bronze motes -->
  <g fill="#f3cb63" filter="url(#soft)">
    <circle class="mote"    cx="300" cy="330" r="2.5"/>
    <circle class="mote m2" cx="410" cy="340" r="1.8"/>
    <circle class="mote m3" cx="820" cy="345" r="2.2"/>
    <circle class="mote m4" cx="930" cy="335" r="1.6"/>
    <circle class="mote m5" cx="640" cy="350" r="2"/>
    <circle class="mote m6" cx="1050" cy="330" r="2.4"/>
  </g>

  <!-- title -->
  <text x="600" y="176" text-anchor="middle" class="serif" font-size="116" font-weight="700" letter-spacing="16" fill="url(#gold)" filter="url(#shadow)">BRONZE</text>
  <rect x="300" y="196" width="600" height="2" fill="url(#goldline)"/>
  <text x="600" y="232" text-anchor="middle" class="serif" font-size="16" letter-spacing="2" fill="#f5e6c4">A PERSISTENT CHARACTER WORKBENCH FOR WORLD OF WARCRAFT</text>
  <text x="600" y="268" text-anchor="middle" class="serif" font-size="17" font-style="italic" fill="#ffd100" opacity="0.95">Remembers your character.  Sims it for free.  Tells you where the gap is.</text>

  <!-- bottom ribbon -->
  <g class="mono" font-size="12.5" fill="#b8a27a" text-anchor="middle">
    <text x="600" y="346">MIDNIGHT  ·  PATCH 12.1  ·  SEASON 2  ·  LEVEL CAP 90  ·  SELF-HOSTED SIMULATIONCRAFT</text>
  </g>

  <!-- right: snapshot timeline with sim bars -->
  <g transform="translate(940,110)">
    <text x="105" y="0" text-anchor="middle" class="serif" font-size="13" letter-spacing="2" fill="#c98a2e">SNAPSHOT HISTORY</text>
    <g fill="#c98a2e" opacity="0.55"><rect x="0" y="176" width="210" height="1"/></g>
    <g>
      <rect    x="18"  y="96"  width="30" height="80" fill="#5a3b1a"/>
      <rect x="66"  y="76"  width="30" height="100" fill="#8a5a2b"/>
      <rect x="114" y="56"  width="30" height="120" fill="#c98a2e"/>
      <rect x="162" y="30"  width="30" height="146" fill="url(#gold)" class="pulse"/>
    </g>
    <g class="mono" font-size="11" fill="#e8d5a8" text-anchor="middle">
      <text x="33"  y="194">JUL</text><text x="81" y="194">AUG</text><text x="129" y="194">SEP</text><text x="177" y="194">NOW</text>
    </g>
    <g class="mono" font-size="11" fill="#1eff00" text-anchor="middle">
      <text x="81" y="66">+1.6%</text><text x="129" y="46">+2.1%</text><text x="177" y="20">+3.4%</text>
    </g>
    <g fill="#f3cb63" stroke="#3a2510" stroke-width="1">
      <polygon points="33,176 39,182 33,188 27,182"/>
      <polygon points="81,176 87,182 81,188 75,182"/>
      <polygon points="129,176 135,182 129,188 123,182"/>
      <polygon points="177,176 183,182 177,188 171,182"/>
    </g>
  </g>
</svg>
