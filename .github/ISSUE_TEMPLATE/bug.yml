name: Bug report
description: Something was discovered, parsed, explained, snapshotted or restored wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach or paste raw files from your `WTF/` folder.** They carry your account name and your characters' names. Describe the shape of the problem, or reduce it to a few lines with names replaced. If you found personal data in a committed fixture, do not open an issue: follow SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: wowlab sv dump <file> --json
  - type: textarea
    id: doctor
    attributes:
      label: Output of `wowlab doctor --redact`
      description: |
        Run `wowlab doctor --redact` and paste what it prints: paste this, nothing else. It replaces your character, realm and account names, BattleTag, email address and home folder with placeholders such as `<CHARACTER>` and `<HOME>`. Your guild's name is not known to wowlab; if it could appear, add `--redact-name "<your guild>"`. Read the output before you paste it.
      render: text
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15 / Windows 11 / Linux + Wine
  - type: textarea
    id: excerpt
    attributes:
      label: Minimal excerpt (optional, names replaced)
      render: text
