name: Bug report
description: Something was discovered, parsed, explained, snapshotted or restored wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Paste no output except that of `wowlab doctor --redact`, and attach no files from your `WTF/` folder.** Other output and those files carry your account name, your characters' names and your home folder, and, if you turned the lab-addon's crew book on, the names, realms and guilds of the players you grouped with and your ratings and notes about them. Never paste `wowlab crew` output or attach `WowLab.lua` or `WowLab.lua.bak`. Never attach wowlab's crew database (the `.sqlite` file in the `crew` folder of wowlab's data folder) or any copy of it. Describe the problem in words, and write any name or path as a placeholder (`<CHARACTER>`, `<REALM>`, `<ACCOUNT>`, `<HOME>`). If you found personal data in a committed fixture, do not open an issue: follow SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: In your own words. Write names and paths as placeholders (`<CHARACTER>`, `<REALM>`, `<ACCOUNT>`, `<HOME>`); do not paste the command's output.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The command you ran, with any name or path in it written as a placeholder.
      placeholder: wowlab sv dump <HOME>/.../SavedVariables/<addon>.lua --json
  - type: textarea
    id: doctor
    attributes:
      label: Output of `wowlab doctor --redact`
      description: |
        Run `wowlab doctor --redact` and paste what it prints: paste this, nothing else. It replaces your character, realm and account names, BattleTag, email address, login and computer names and home folder with placeholders such as `<CHARACTER>` and `<HOME>`. It leaves the crew book out: it says only whether the book is on and how many players it keeps. Your guild's name is not known to wowlab; if it could appear, add `--redact-name "<your guild>"`. Read the output before you paste it.
      render: text
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15 / Windows 11 / Linux + Wine
