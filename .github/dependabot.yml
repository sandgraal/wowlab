version: 2

# Every PR Dependabot opens runs the full CI workflow; an update that breaks
# lint, tests, or a scan cannot merge. Add npm (web/), gomod (agent/) and
# docker (worker/) ecosystems when those directories land.
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-dev-tooling:
        patterns: ["ruff", "mypy", "pytest", "pytest-*", "pre-commit", "httpx"]
        update-types: ["minor", "patch"]
      python-runtime:
        patterns: ["fastapi", "uvicorn", "pydantic", "pydantic-*", "sqlalchemy", "alembic", "psycopg*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
