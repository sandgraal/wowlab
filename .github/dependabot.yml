version: 2

# Every PR Dependabot opens runs the full CI workflow; an update that breaks
# lint, tests, or a scan cannot merge. The repository is Python only; a new
# ecosystem is added here in the wave whose ADR introduces it (ADR-0020).
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-dev-tooling:
        patterns: ["ruff", "mypy", "pytest", "pytest-*", "pre-commit"]
        update-types: ["minor", "patch"]
      python-runtime:
        patterns: ["pydantic", "pydantic-*", "typer", "httpx", "platformdirs", "psutil"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
