name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Every job below except `lab (macos)` and `grader-diff` (M16-40; not yet
# in the ruleset, see the job) is a required status check on main,
# by exact name (see .github/rulesets/main.json). `lab (macos)` came with
# M13-02 (ADR-0031, docs/LAB_PLAN.md §9 and §15.3 E3) and counts toward
# macOS being supported without being required. `lab (windows)` lives in
# windows.yml and is not required (ADR-0014 amendments of 2026-10-15).
# Renaming a job means
# changing the ruleset and re-applying it with scripts/bootstrap-github.sh.
#
# No job restores or saves an Actions cache (M13-42). The cache is shared
# by every workflow running in main's scope, so an entry these jobs restored
# could have been written by any of them. (Until 2026-11-04 two of them ran
# a model with a token whose cache mode is write; no workflow runs Claude
# since the owner decision of that date.)
# setup-uv runs with `enable-cache: false` (omitted means `auto`, which
# caches), trivy with `cache: false` (it defaults to true), and actionlint
# and gitleaks are downloaded fresh at a pinned release and checked against
# a sha256 (M13-65); tests/repo/test_workflows_use_no_cache.py holds every
# workflow to it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.12"
  PYTHON_VERSION: "3.12"

jobs:
  # Detects a docs-only PR (docs/**/*.md and the root *.md files listed below)
  # so the required jobs can run a trivial, genuinely successful step instead
  # of the full suite.
  # This is deliberately NOT an `on.pull_request.paths` filter: that would
  # stop the workflow from triggering, leaving every required check stuck at
  # "Expected". Every downstream job carries `if: ${{ !cancelled() }}` so a
  # failure *here* runs the full suite rather than skipping it (a skipped
  # required job reports as passing). `.claude/**`, `.github/**`, AGENTS.md
  # and CLAUDE.md are never docs-only: they are agent instructions and the
  # harness, and changes to them must be validated. README.md is not
  # docs-only either: tests/scripts/test_readme.py grades its first screen
  # (M13-10), so a README-only PR runs the suite. The same holds for every
  # doc a test reads (`doc_tests` below, M16-83): a PR touching only one of
  # them runs the tests that grade it. tests/repo/test_doc_tests_filter.py
  # fails when a test starts reading a doc this list leaves out.
  changes:
    name: Detect doc-only changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.filter.outputs.non_docs == 'false' && steps.filter.outputs.doc_tests == 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            non_docs:
              - '**'
              - '!docs/**/*.md'
              - '!CONTRIBUTING.md'
              - '!SECURITY.md'
              - '!CODE_OF_CONDUCT.md'
            doc_tests:
              - 'CONTRIBUTING.md'
              - 'SECURITY.md'
              - 'docs/BACKLOG.md'
              - 'docs/DECISIONS.md'
              - 'docs/INSTALL.md'
              - 'docs/LAB_FILE_MAP.md'
              - 'docs/LAB_FORMATS.md'
              - 'docs/LAB_PLAN.md'
              - 'docs/handoffs/M11-03.md'
              - 'docs/handoffs/M13-10-macos.md'

  quality:
    name: Lint, typecheck, tests
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        run: uv sync --frozen
      - name: Lua lint (selene, lab/addon)
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        run: |
          uv run --frozen python scripts/fetch_selene.py
          make lint-lua
      - name: ruff check
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        run: uv run --frozen ruff check --output-format=github .
      - name: ruff format --check
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        run: uv run --frozen ruff format --check .
      - name: mypy --strict
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        run: uv run --frozen mypy
      - name: Generate a decimal-comma locale (serializer determinism graders)
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        run: sudo locale-gen de_DE.UTF-8
      # Two passes (M13-18): everything not `serial` across the runner's
      # cores, then the RSS and CPU-time budget tests (`serial`, marked in
      # conftest.py) alone. A command-line -m replaces the one in addopts,
      # so both keep `not live`.
      - name: pytest (parallel)
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        run: uv run --frozen pytest -q -n auto --dist worksteal -m "not live and not serial"
      - name: pytest (serial)
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        run: uv run --frozen pytest -q -m "serial and not live"
      - name: wowlab --version
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        run: uv run --frozen wowlab --version
      - name: Doc-only PR — skipped
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: echo "doc-only PR — suite skipped"

  parser-suite:
    name: Parser fixtures and round-trip
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Generate a decimal-comma locale (serializer determinism graders)
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        run: sudo locale-gen de_DE.UTF-8
      - name: make test-parser
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        run: |
          uv sync --frozen
          make test-parser
      - name: Doc-only PR — skipped
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: echo "doc-only PR — parser suite skipped"

  # The Lab suite on macOS, the owner's platform (ADR-0031, M13-02,
  # docs/LAB_PLAN.md §15.3 E3); not required. Windows runs in windows.yml,
  # after every merge to main and nightly, off the PR path (ADR-0014
  # amendment of 2026-10-15). The Linux-only lint, Lua lint and locale steps
  # stay in `quality`.
  lab-desktop:
    name: lab (${{ matrix.name }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        run: uv sync --frozen
      - name: pytest lab/core/tests (parallel)
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        run: uv run --frozen pytest -q -n auto --dist worksteal -m "not live and not serial" lab/core/tests
      - name: pytest lab/core/tests (serial)
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        run: uv run --frozen pytest -q -m "serial and not live" lab/core/tests
      - name: wowlab --version
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        run: uv run --frozen wowlab --version
      - name: Doc-only PR — skipped
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: echo "doc-only PR - lab suite skipped"

  harness:
    name: Agent harness (hooks on 3.9 and 3.12, lockfile, workflows)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Hook tests (python ${{ matrix.python }})
        run: uv run --python ${{ matrix.python }} --isolated --no-project --with pytest -- pytest -q tests/harness
      - name: Hooks lint clean (ruff, mypy at 3.10 floor)
        if: matrix.python == '3.9'
        run: |
          uv sync --frozen
          uv run --frozen ruff check .claude/hooks tests/harness
          uv run --frozen mypy --python-version 3.10 --strict .claude/hooks
      - name: Lockfile is current
        if: matrix.python == '3.12'
        run: uv lock --check
      - name: Agent, skill and rule frontmatter is well-formed
        if: matrix.python == '3.12'
        run: uv run --python 3.12 --isolated --no-project --with pyyaml -- python scripts/check_frontmatter.py
      # actionlint at an exact release, checked against the sha256 that the
      # release's actionlint_<version>_checksums.txt gives for the tarball
      # before it is unpacked, as the gitleaks job does (M13-65). The same
      # version as the pre-commit hook (tests/repo/test_ci_actionlint_pinned.py).
      # Bumping it means a new version here and in .pre-commit-config.yaml and
      # the new digest from that release's checksums file.
      # Nothing else is installed: actionlint runs shellcheck on `run:`
      # scripts from the runner image, and `-pyflakes=` turns pyflakes off
      # (no step uses `shell: python`).
      - name: Install actionlint
        if: matrix.python == '3.12'
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version
      - name: actionlint
        if: matrix.python == '3.12'
        run: actionlint -color -pyflakes=

  gitleaks:
    name: Secret scan (gitleaks)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # Full history: a secret that was committed and later deleted still
      # needs rotating. `gitleaks git` (not `dir`) so build output is ignored.
      # --max-archive-depth: a compressed fixture (.gz) is scanned decompressed;
      # without it the blob's contents never reach a rule.
      - name: Scan committed history
        run: gitleaks git . --redact --exit-code 1 --config .gitleaks.toml --max-archive-depth 1

  semgrep:
    name: SAST (semgrep)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.176.0@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        # Rulesets kept narrow on purpose; widen deliberately when a wave adds a language.
        run: |
          semgrep scan --config p/python --config p/secrets --config p/github-actions \
            --error --metrics=off --exclude .venv --exclude .claude/worktrees
      - name: Doc-only PR — skipped
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: echo "doc-only PR — semgrep skipped"

  trivy:
    name: Dependency and config scan (trivy)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          # Its default restores the trivy binary (setup-trivy) and its
          # vulnerability database from the Actions cache.
          cache: false
      - name: Doc-only PR — skipped
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: echo "doc-only PR — trivy skipped"

  # M16-40 (ADR-0013): on a change to a load-bearing file (luadata.py,
  # guard.py, proposal.py), a grader already on main may change only by
  # deleting complete xfail(strict=True) marker blocks, and test support
  # files, conftest.py and pytest configuration may not change. The rule and
  # what counts as a grader are in scripts/check_grader_diff.py. HEAD^1..HEAD
  # is the pull request's merge commit against its base (on a push to main,
  # the squash-merged commit), so a depth of 2 is all the history it reads.
  # The script runs only from the base revision: an edit to the script
  # cannot loosen the check that judges it, and an edit to this job shows
  # here in ci.yml. A base without the script fails the step; the PR's own
  # copy is never run (M16-59, tests/repo/test_grader_diff_base_copy.py).
  # It is stdlib-only and runs on the runner's python3 with -I, so nothing
  # is installed or fetched.
  # Not yet a required check: adding it means changing
  # .github/rulesets/main.json and re-applying it after this job is on main.
  grader-diff:
    name: Graders activated by marker deletion only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check grader diffs
        run: |
          script="$RUNNER_TEMP/check_grader_diff.py"
          if ! git cat-file -e HEAD^1:scripts/check_grader_diff.py 2>/dev/null; then
            echo "::error::scripts/check_grader_diff.py is missing from the base revision (HEAD^1). The grader check runs only from the base copy, so a pull request cannot change the script that judges it; refusing to fall back to this branch's copy."
            exit 1
          fi
          git show HEAD^1:scripts/check_grader_diff.py > "$script"
          python3 -I "$script" --repo . --base HEAD^1 --head HEAD
