name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Every job below except `grader-diff` (M16-40; not yet in the ruleset, see
# the job), `changes` and `quality` is a required status check on main, by
# exact name (see .github/rulesets/main.json). `quality` ("Lint, typecheck,
# tests") is not required (owner decision, 2026-11-18, M15-16), but no PR
# merges before it is green: pr-shepherd reads it by name. The Lab suite on the desktop platforms runs
# off the pull-request path, nightly and on demand (until 2026-11-18 also
# after each merge to main; M15-21, owner decision), and neither is
# required: `lab (macos)` in macos.yml (it was this file's
# `lab-desktop` job until 2026-11-17, M18-15, owner decision) and
# `lab (windows)` in windows.yml (ADR-0014 amendments of 2026-10-15).
# The whole Linux suite, with what `quality` leaves out since M15-21 (the
# lab-addon mutation probes when no addon path changed, the serial pass),
# runs every night in nightly.yml.
# Renaming a job means
# changing the ruleset and re-applying it with scripts/bootstrap-github.sh.
#
# No job restores or saves an Actions cache (M13-42). The cache is shared
# by every workflow running in main's scope, so an entry these jobs restored
# could have been written by any of them. (Until 2026-11-04 two of them ran
# a model with a token whose cache mode is write; no workflow runs Claude
# since the owner decision of that date.)
# setup-uv runs with `enable-cache: false` (omitted means `auto`, which
# caches), trivy with `cache: false` (it defaults to true), and actionlint
# and gitleaks are downloaded fresh at a pinned release and checked against
# a sha256 (M13-65); tests/repo/test_workflows_use_no_cache.py holds every
# workflow to it.
permissions:
  contents: read

# A newer push cancels the run in progress, on a pull request and on main
# alike (M15-21, 2026-11-18; until then only pull requests). The newest commit
# on main contains every older one, so grading it is enough, provided the run
# on it is a full one: a push to main is never docs-only and always runs the
# mutation probes (the `changes` job's outputs below), so a break in an older
# commit is still red on the newer run, whatever the newer commit touched.
# Each change's own pull request run graded it before it merged as well.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.12"
  PYTHON_VERSION: "3.12"

jobs:
  # Detects a docs-only PR (docs/**/*.md and the root *.md files listed below)
  # so the required jobs can run a trivial, genuinely successful step instead
  # of the full suite.
  # This is deliberately NOT an `on.pull_request.paths` filter: that would
  # stop the workflow from triggering, leaving every required check stuck at
  # "Expected". Every downstream job carries `if: ${{ !cancelled() }}` so a
  # failure *here* runs the full suite rather than skipping it (a skipped
  # required job reports as passing). `.claude/**`, `.github/**`, AGENTS.md
  # and CLAUDE.md are never docs-only: they are agent instructions and the
  # harness, and changes to them must be validated. README.md is not
  # docs-only either: tests/scripts/test_readme.py grades its first screen
  # (M13-10), so a README-only PR runs the suite. The same holds for every
  # doc a test reads (`doc_tests` below, M16-83): a PR touching only one of
  # them runs the tests that grade it. tests/repo/test_doc_tests_filter.py
  # fails when a test starts reading a doc this list leaves out.
  changes:
    name: Detect doc-only changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Both outputs narrow a pull request only. A push to main always takes
      # the full path, probes included (M15-21 review): with superseded runs
      # cancelled, a push's filter sees only the diff from the commit before
      # it, so a docs-only merge landing seconds after a code merge would
      # otherwise cancel the code merge's run and skip the suite on that tree.
      docs_only: ${{ github.event_name == 'pull_request' && steps.filter.outputs.non_docs == 'false' && steps.filter.outputs.doc_tests == 'false' }}
      # Whether the lab-addon grader mutation probes run (M15-21; owner
      # decision, 2026-11-18): on a pull request only when one of these paths
      # changes. They read nothing else that can turn them red (conftest.py,
      # ADDON_MUTATION_FILES). Every night nightly.yml runs them.
      # tests/repo/test_addon_mutation_marking.py holds this list to the
      # conftest's, and tests/repo/test_push_runs_everything.py pins both
      # outputs.
      addon_probes: ${{ github.event_name != 'pull_request' || steps.filter.outputs.addon_probes == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            non_docs:
              - '**'
              - '!docs/**/*.md'
              - '!CONTRIBUTING.md'
              - '!SECURITY.md'
              - '!CODE_OF_CONDUCT.md'
            doc_tests:
              - 'CONTRIBUTING.md'
              - 'SECURITY.md'
              - 'docs/INSTALL.md'
              - 'docs/LAB_FILE_MAP.md'
              - 'docs/LAB_FORMATS.md'
              - 'docs/LAB_PLAN.md'
              - 'docs/handoffs/M11-03.md'
              - 'docs/handoffs/M13-10-macos.md'
            addon_probes:
              - 'lab/addon/**'
              - 'tests/addon/**'
              - 'lab/core/src/wowlab_core/toc.py'
              - 'conftest.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'lab/core/tests/review/test_m11_01_carry_check_misses_saved_subtables.py'
              - 'lab/core/tests/review/test_m11_01_line_based_privacy_tests_fail_open.py'
              - 'lab/core/tests/review/test_m11_01_pet_guid_check_misses_concatenated_lookup.py'
              - 'lab/core/tests/review/test_m11_13_stored_value_check_misses_call_stores.py'
              - 'lab/core/tests/review/test_m11_37_bidi_scan_skips_a_file_with_one_stray_byte.py'
              - 'lab/core/tests/review/test_m11_37_section_scan_accepts_a_client_call_in_carry.py'
              - 'lab/core/tests/review/test_m11_37_section_scan_misses_a_second_namespace_binding.py'
              - 'lab/core/tests/review/test_m11_37_section_scan_misses_client_function_handed_on.py'
              - 'lab/core/tests/review/test_m11_37_section_scan_misses_client_object_kept_in_a_file_local.py'
              - 'lab/core/tests/review/test_m11_37_section_scan_misses_ns_method_call_and_alias.py'
              - 'lab/core/tests/review/test_m11_37_section_scan_misses_self_and_client_given_parameters.py'
              - 'lab/core/tests/review/test_m13_05_combat_scan_accepts_a_combat_check_that_never_blocks.py'
              - 'lab/core/tests/review/test_m13_05_macro_pin_misses_the_name_stored_through_underscore.py'
              - 'lab/core/tests/review/test_m13_05_secret_scan_misses_a_cleaned_value_read_as_a_table_through_an_alias.py'
              - 'lab/core/tests/review/test_m13_05_secret_scan_misses_a_raw_value_not_from_a_named_handle.py'
              - 'lab/core/tests/review/test_m13_05_secret_scan_misses_a_rebound_is_secret.py'
              - 'lab/core/tests/review/test_m20_11_hollow_once_and_limit_rules.py'
              - 'lab/core/tests/review/test_m20_13_kept_rules_miss_a_new_gather_path_and_an_own_value_outside_identity.py'
              - 'lab/core/tests/review/test_m20_14_kept_rules_miss_a_method_cut_note_and_a_non_unit_tooltip_hook.py'

  quality:
    name: Lint, typecheck, tests
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv and the install run on a docs-only PR too: its bidi step below
      # needs pytest (M16-89).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install
        run: uv sync --frozen
      - name: Lua lint (selene, lab/addon)
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        run: |
          uv run --frozen python scripts/fetch_selene.py
          make lint-lua
      - name: ruff check
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        run: uv run --frozen ruff check --output-format=github .
      - name: ruff format --check
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        run: uv run --frozen ruff format --check .
      - name: mypy --strict
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        run: uv run --frozen mypy
      - name: Generate a decimal-comma locale (serializer determinism graders)
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        run: sudo locale-gen de_DE.UTF-8
      # The parallel pass (M13-18): everything not `serial` across the
      # runner's cores. A command-line -m replaces the one in addopts, so it
      # keeps `not live`.
      # Since M15-21 (owner decisions, 2026-11-18) this job runs less than the
      # whole suite; nightly.yml runs all of it every night at 09:17 UTC
      # (off-hours for the owner), and release.yml on every tag:
      # - the lab-addon grader mutation probes (`addon_mutation`, marked in
      #   conftest.py) run only when the `changes` job's `addon_probes` filter
      #   matched, or when that job failed: exactly one of the next two steps
      #   runs;
      # - the serial pass (the RSS and CPU-time budget tests) runs nightly
      #   only, except two tests that are serial for what they do to the
      #   machine, not because they measure, and that guard the write gate,
      #   so they stay here, alone, after the parallel pass: the one that
      #   calls os.fork guards the gate's lock (L2), and the perf-budget test
      #   that starts a process named like the game client (M15-18) shows
      #   that the gate's client check refuses it, so no helper in
      #   scripts/perf_budget.py skips that check. Its sibling, the pipeline
      #   run on a small tree, stays nightly.
      - name: pytest (parallel)
        if: needs.changes.result != 'success' || (needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.addon_probes == 'true')
        run: uv run --frozen pytest -q -n auto --dist worksteal -m "not live and not serial"
      - name: pytest (parallel, lab-addon mutation probes skipped)
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.addon_probes != 'true'
        run: uv run --frozen pytest -q -n auto --dist worksteal -m "not live and not serial and not addon_mutation"
      - name: pytest (the write gate's serial tests)
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        run: >-
          uv run --frozen pytest -q
          "lab/core/tests/test_guard_pins_m10_16.py::test_constructed_pin_a_forked_child_leaving_the_with_neither_unlocks_nor_commits"
          "tests/scripts/test_perf_budget.py::test_constructed_without_the_stub_the_gate_refuses_the_same_children"
      - name: wowlab --version
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        run: uv run --frozen wowlab --version
      # A docs-only PR skips the suite, and with it the bidi scan, which reads
      # every tracked file, docs included (M16-89). This runs that one file,
      # so a doc cannot gain a bidi control until the next code PR. The full
      # suite above runs it on every other PR. The crew-book scan (M19-04)
      # reads every tracked file too, so a doc cannot gain a crew record.
      - name: Doc-only PR — bidi controls
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: uv run --frozen pytest -q tests/repo/test_bidi_controls.py tests/repo/test_crew_book_out_of_repo.py
      - name: Doc-only PR — suite skipped
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: echo "doc-only PR — suite skipped (bidi controls checked above)"

  parser-suite:
    name: Parser fixtures and round-trip
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Generate a decimal-comma locale (serializer determinism graders)
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        run: sudo locale-gen de_DE.UTF-8
      - name: make test-parser
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        run: |
          uv sync --frozen
          make test-parser
      - name: Doc-only PR — skipped
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: echo "doc-only PR — parser suite skipped"

  harness:
    name: Agent harness (hooks on 3.9 and 3.12, lockfile, workflows)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Hook tests (python ${{ matrix.python }})
        run: uv run --python ${{ matrix.python }} --isolated --no-project --with pytest -- pytest -q tests/harness
      - name: Hooks lint clean (ruff, mypy at 3.10 floor)
        if: matrix.python == '3.9'
        run: |
          uv sync --frozen
          uv run --frozen ruff check .claude/hooks tests/harness
          uv run --frozen mypy --python-version 3.10 --strict .claude/hooks
      - name: Lockfile is current
        if: matrix.python == '3.12'
        run: uv lock --check
      - name: Agent, skill and rule frontmatter is well-formed
        if: matrix.python == '3.12'
        run: uv run --python 3.12 --isolated --no-project --with pyyaml -- python scripts/check_frontmatter.py
      # actionlint at an exact release, checked against the sha256 that the
      # release's actionlint_<version>_checksums.txt gives for the tarball
      # before it is unpacked, as the gitleaks job does (M13-65). The same
      # version as the pre-commit hook (tests/repo/test_ci_actionlint_pinned.py).
      # Bumping it means a new version here and in .pre-commit-config.yaml and
      # the new digest from that release's checksums file.
      # Nothing else is installed: actionlint runs shellcheck on `run:`
      # scripts from the runner image, and `-pyflakes=` turns pyflakes off
      # (no step uses `shell: python`).
      - name: Install actionlint
        if: matrix.python == '3.12'
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version
      - name: actionlint
        if: matrix.python == '3.12'
        run: actionlint -color -pyflakes=

  gitleaks:
    name: Secret scan (gitleaks)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # Full history: a secret that was committed and later deleted still
      # needs rotating. `gitleaks git` (not `dir`) so build output is ignored.
      # --max-archive-depth: a compressed fixture (.gz) is scanned decompressed;
      # without it the blob's contents never reach a rule.
      - name: Scan committed history
        run: gitleaks git . --redact --exit-code 1 --config .gitleaks.toml --max-archive-depth 1

  semgrep:
    name: SAST (semgrep)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.176.0@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        # Rulesets kept narrow on purpose; widen deliberately when a wave adds a language.
        run: |
          semgrep scan --config p/python --config p/secrets --config p/github-actions \
            --error --metrics=off --exclude .venv --exclude .claude/worktrees
      - name: Doc-only PR — skipped
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: echo "doc-only PR — semgrep skipped"

  trivy:
    name: Dependency and config scan (trivy)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true'
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          # Its default restores the trivy binary (setup-trivy) and its
          # vulnerability database from the Actions cache.
          cache: false
      - name: Doc-only PR — skipped
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'
        run: echo "doc-only PR — trivy skipped"

  # M16-40 (ADR-0013): on a change to a load-bearing file (luadata.py,
  # guard.py, proposal.py), a grader already on main may change only by
  # deleting complete xfail(strict=True) marker blocks, and test support
  # files, conftest.py and pytest configuration may not change. The rule and
  # what counts as a grader are in scripts/check_grader_diff.py. HEAD^1..HEAD
  # is the pull request's merge commit against its base (on a push to main,
  # the squash-merged commit), so a depth of 2 is all the history it reads.
  # The script runs only from the base revision: an edit to the script
  # cannot loosen the check that judges it, and an edit to this job shows
  # here in ci.yml. A base without the script fails the step; the PR's own
  # copy is never run (M16-59, tests/repo/test_grader_diff_base_copy.py).
  # It is stdlib-only and runs on the runner's python3 with -I, so nothing
  # is installed or fetched.
  # Not yet a required check: adding it means changing
  # .github/rulesets/main.json and re-applying it after this job is on main.
  grader-diff:
    name: Graders activated by marker deletion only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check grader diffs
        run: |
          script="$RUNNER_TEMP/check_grader_diff.py"
          if ! git cat-file -e HEAD^1:scripts/check_grader_diff.py 2>/dev/null; then
            echo "::error::scripts/check_grader_diff.py is missing from the base revision (HEAD^1). The grader check runs only from the base copy, so a pull request cannot change the script that judges it; refusing to fall back to this branch's copy."
            exit 1
          fi
          git show HEAD^1:scripts/check_grader_diff.py > "$script"
          python3 -I "$script" --repo . --base HEAD^1 --head HEAD
