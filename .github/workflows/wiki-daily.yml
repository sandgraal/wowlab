name: Wiki daily

# Checks and improves the GitHub wiki once a day, then pushes it with no pull
# request (owner decision 2026-09-30, ticket M12-14). Five jobs, so that the
# model, the gates that judge its work and the push credential never share a
# runner:
#
#   previous-report  on main: finds the last run, and when it failed, hands
#            its gate report on to improve as an artifact of this run. Runs
#            nothing from the repository or the wiki. The only job that can
#            read Actions, so the model's job does not need to.
#   improve  reads main and a credential-free clone of the wiki, regenerates
#            CLI-Reference, lets Claude edit the wiki copy (prompt:
#            .github/prompts/wiki-daily.md), checks that nothing under repo/
#            changed (ignored paths included), and hands the edited top-level
#            pages on as a short-lived artifact, withholding them when
#            check_wiki finds personal data in them (a check that can only
#            block). No gate that could pass them runs after the model.
#            Read-only token only. Uses no cache (M13-39).
#   gates    on a fresh runner (M13-19): a model that got past its
#            permissions could rewrite anything on improve's runner, its later
#            steps' environment included ($GITHUB_ENV can set BASH_ENV or
#            LD_PRELOAD for them), so nothing judged there can be trusted.
#            This job checks out main and clones the wiki at the pass's base
#            itself, takes only the pages from improve, as data, records the
#            pass in .lab/state.json, and gates the result with
#            scripts/check_wiki.py and gitleaks. Uses no cache. Read-only.
#   publish  on main only, and only when the repository variable
#            WIKI_DAILY_PUBLISH is `true`: a scheduled run, or a dispatch with
#            push: true. Takes the pages that `gates` passed, by artifact id,
#            as data, rebuilds the generated page and .lab/state.json itself,
#            runs both gates again, commits and pushes. The model cannot
#            influence it beyond page text.
#   report   when any of those jobs fails on main: opens, or comments on, the
#            one open issue labelled wiki-daily. Nothing is pushed on a failure.
#
# Publishing is off until the owner sets the repository variable
# WIKI_DAILY_PUBLISH to `true` (Settings > Secrets and variables > Actions >
# Variables), after reading the diff artifact of a dispatch run whose Claude
# step ran. Until then every run is a dry run: gates uploads the gate report
# and, when the gate found no personal data and gitleaks found nothing, the
# pages and the wiki diff as artifacts (wiki-daily-report, wiki-daily-pages).
# improve's wiki-daily-unchecked artifact, the pages before the gates (never
# when check_wiki found personal data in them), is kept for one day.
#
# Needs CLAUDE_CODE_OAUTH_TOKEN, a token for the owner's Claude subscription
# (docs/SETUP.md); every run counts against that subscription's usage limits.
# Without it the Claude step skips cleanly and the rest still runs. When the
# token is rejected or a usage limit is hit, the Claude step fails: improve
# fails, nothing is pushed, and report comments on the wiki-daily issue.
#
# Permissions beyond `contents: read`: `actions: read` on previous-report
# (and nothing else there), `contents: write` on publish, `issues: write` on
# report. improve, the job that hands its token to the model, and gates have
# `contents: read` only. The push uses publish's own GITHUB_TOKEN. Verified on
# 2026-09-30 (M12-14 dry run, runs 36765448581 and 36765760456): the wiki's
# push service accepted a `contents: write` GITHUB_TOKEN (HTTP 200 on the
# receive-pack advertisement) and refused a `contents: read` one (HTTP 403;
# its fetch got 200). It lives for that job only and cannot bypass the
# main-branch ruleset, so the WIKI_PUSH_TOKEN secret (a long-lived,
# fine-grained token) is not used.

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      push:
        description: Push the result to the wiki (needs the WIKI_DAILY_PUBLISH variable)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wiki-daily
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  UV_VERSION: "0.12.12"
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # Pinned by full id, as in claude-review.yml.
  WIKI_MODEL: claude-opus-5-5

jobs:
  # So that repeated near misses converge: the report of the last run on
  # main, when that run failed and kept its report. No checkout; gh is the
  # runner's own. Never fails the run: a missing report is no report.
  previous-report:
    name: Fetch the previous run's gate report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Download the previous run's gate report
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow wiki-daily.yml --branch main \
            --status completed --limit 5 --json databaseId,conclusion \
            --jq "map(select(.databaseId != ${GITHUB_RUN_ID}))[0] | select(.conclusion == \"failure\") | .databaseId")
          if [ -n "$prev" ] && gh run download "$prev" --repo "$GITHUB_REPOSITORY" \
              --name wiki-daily-report --dir "$RUNNER_TEMP/previous"; then
            mkdir -p previous
            cp "$RUNNER_TEMP/previous/check.txt" previous/check.txt
            echo "$prev" > previous/run-id.txt
          fi
      - name: Hand it on
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiki-daily-previous-report
          path: previous/
          if-no-files-found: ignore
          retention-days: 1

  improve:
    name: Check and improve the wiki
    needs: previous-report
    # Runs whatever happened to previous-report (a missing report is no
    # report), unless the run was cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    # Only what steps before the model wrote, and step outcomes: a step's
    # outputs are fixed when it ends, and an outcome is the runner's own
    # record. Nothing a step after the model writes leaves this job except
    # the unchecked pages, which gates takes as data.
    outputs:
      main_sha: ${{ steps.plan.outputs.main }}
      wiki_base: ${{ steps.wiki.outputs.base }}
      wiki_branch: ${{ steps.wiki.outputs.branch }}
      review: ${{ steps.plan.outputs.review }}
      plan: ${{ steps.plan.outcome }}
      claude: ${{ steps.claude.outcome }}
      claude_ran: ${{ steps.claude.outcome == 'success' }}
      outside: ${{ steps.outside.outcome }}
      withhold: ${{ steps.withhold.outcome }}
      handoff: ${{ steps.handoff.outcome }}
    env:
      # Claude Code strips credentials from the environment of every command
      # it runs (the only one it may run is the gate on the wiki).
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      # The workspace root is deliberately not a git repository: main is
      # checked out into repo/, the wiki cloned into wiki/, the run's input
      # written to context/. The Claude action writes its token into the git
      # config of the directory it starts in; here there is none to write to.
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: repo
          fetch-depth: 0
          persist-credentials: false
      # No cache, restored or saved (M13-39): the job that runs the model has
      # no cache step, so no entry it could have written is saved for main,
      # which five jobs restored from (the four cached jobs in ci.yml and
      # lab-windows in windows.yml) until M13-42 turned their cache off too;
      # no job in any workflow restores one now (test_workflows_use_no_cache).
      # A fresh `uv sync` costs about a second.
      # The Claude action's own setup-bun is pinned with `no-cache: true`.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install
        working-directory: repo
        run: uv sync --frozen
      - name: Clone the wiki (public, no credential)
        id: wiki
        run: |
          git clone --quiet "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.wiki.git" wiki
          echo "base=$(git -C wiki rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=$(git -C wiki symbolic-ref --short HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p report context
      # Written before the check and before Claude, and verified byte for byte
      # by the gate afterwards: nobody edits the generated page.
      - name: Regenerate CLI-Reference
        working-directory: repo
        run: uv run --frozen python scripts/gen_command_reference.py --out ../wiki/CLI-Reference.md
      - name: Plan the run
        id: plan
        working-directory: repo
        run: |
          plan=$(uv run --frozen python scripts/wiki_state.py plan --wiki ../wiki --repo . --context ../context)
          echo "$plan"
          echo "main=$(jq -r .main <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "review=$(jq -r '.review | join(",")' <<<"$plan")" >> "$GITHUB_OUTPUT"
          # What the gate would reject now: the model's list of gaps to fill.
          # Its lines never quote personal data, so printing them is safe.
          uv run --frozen python scripts/check_wiki.py ../wiki > ../context/check-before.txt || true
          cat ../context/check-before.txt
      # The previous run's gate report, from previous-report (an artifact of
      # this run, so no Actions permission). Absent when there is none.
      - name: The previous run's gate report
        if: steps.plan.outcome == 'success' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wiki-daily-previous-report
          path: ${{ runner.temp }}/previous
      - name: Point the run at the previous report
        if: steps.plan.outcome == 'success' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          prev=$(cat "$RUNNER_TEMP/previous/run-id.txt" 2>/dev/null || true)
          if [[ "$prev" =~ ^[0-9]+$ ]] && [ -f "$RUNNER_TEMP/previous/check.txt" ]; then
            cp "$RUNNER_TEMP/previous/check.txt" context/previous-check.txt
            echo "- The previous run (${prev}) was rejected by the gate; its report is \`context/previous-check.txt\`." >> context/run.md
          fi

      # A presence check only, as in claude-review.yml (see the comment there):
      # a subscription token has no documented check that spends no usage. A
      # rejected token or a usage limit fails the Claude step (is_error:true);
      # the diagnosis step below prints the limit message, improve fails, and
      # publish does not run.
      - name: Check secret
        id: secret
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "CLAUDE_CODE_OAUTH_TOKEN is not set; skipping the Claude step (see docs/SETUP.md)"; echo "present=false" >> "$GITHUB_OUTPUT"; fi

      # Claude Code reads CLAUDE.md files (and a .claude folder's settings and
      # rules) as instructions. Neither the pinned action nor the CLI has an
      # input that turns that off for folders below the working directory, so
      # they are removed from both checkouts before the model starts.
      - name: Keep instruction files out of the model's reach
        if: steps.plan.outcome == 'success'
        run: |
          find repo wiki \( -path repo/.git -o -path wiki/.git \) -prune -o \
            \( -iname CLAUDE.md -o -iname CLAUDE.local.md -o \( -type d -name .claude \) \) -print0 \
            | xargs -0 -r rm -rf --
      # What "Nothing outside the wiki changed" compares against, taken after
      # the last step before the model that runs repository code. `git status`
      # does not list ignored paths, and a .pth file in the venv or a .pyc in
      # any __pycache__ runs on the next `uv run`, so the snapshot covers every
      # path under repo/: a sha256 of each regular file (a content hash, so
      # resetting an mtime hides nothing), each symlink's target, each
      # directory, and the executable bits. Under .git it covers config,
      # hooks and refs, which decide what `git status` runs; not the object
      # store or the index, which git itself rewrites. The hashes of both
      # listings are step outputs, which nothing the model writes can change.
      # System tools only, from an absolute shell and PATH, so that nothing
      # added to PATH (by an action, or through $GITHUB_PATH) is looked up
      # first. The snapshot function is identical in both steps
      # (tests/repo/test_wiki_daily_outside.py).
      - name: Snapshot the checkout of main
        id: before
        if: steps.plan.outcome == 'success'
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          snapshot() {
            ( cd "$1" || exit 1
              list() { find . \( -path ./.git/objects -o -path ./.git/index \) -prune -o "$@" -print0 | LC_ALL=C sort -z; }
              list -type f | xargs -0 -r sha256sum --
              list -type f -perm -100 | while IFS= read -r -d '' p; do printf 'x %q\n' "$p"; done
              list -type l | while IFS= read -r -d '' p; do printf 'l %q %q\n' "$p" "$(readlink -- "$p")"; done
              list -type d | while IFS= read -r -d '' p; do printf 'd %q\n' "$p"; done
              list ! -type f ! -type d ! -type l | while IFS= read -r -d '' p; do printf 'o %q\n' "$p"; done
            )
          }
          status() { GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null git -C "$1" -c core.fsmonitor=false status --porcelain; }
          snapshot repo > "$RUNNER_TEMP/repo-tree-before"
          status repo > "$RUNNER_TEMP/repo-status-before"
          echo "tree=$(sha256sum < "$RUNNER_TEMP/repo-tree-before" | cut -c1-64)" >> "$GITHUB_OUTPUT"
          echo "status=$(sha256sum < "$RUNNER_TEMP/repo-status-before" | cut -c1-64)" >> "$GITHUB_OUTPUT"
          echo "$(wc -l < "$RUNNER_TEMP/repo-tree-before") entries under repo/"
      # Runs even when the Claude step will not, so a skipped run still
      # proves the prompt and the settings are well-formed.
      - name: Build the prompt and the permission settings
        id: prompt
        if: steps.plan.outcome == 'success'
        run: |
          delim="WIKI_DAILY_$(openssl rand -hex 16)"
          {
            echo "text<<${delim}"
            cat repo/.github/prompts/wiki-daily.md
            echo
            cat context/run.md
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"
          # Deny rules win over every allow rule. `//` starts an absolute path.
          # The runner's temp directory is closed to edits as well as reads
          # (M13-19, defence in depth): uv's cache and interpreters, the
          # runner's per-step command files ($GITHUB_ENV among them), these
          # settings and the snapshot of repo/ are kept there.
          ws="/${GITHUB_WORKSPACE}"
          jq -n --arg ws "$ws" --arg tmp "/${RUNNER_TEMP}" '{
            permissions: {
              disableBypassPermissionsMode: "disable",
              deny: [
                "WebFetch", "WebSearch", "NotebookEdit", "Task", "Agent",
                "Read(./.git/config)",
                "Read(//proc/**)", "Read(//sys/**)", "Read(//etc/**)", "Read(//root/**)",
                "Read(\($tmp)/**)",
                "Read(//home/runner/actions-runner/**)", "Read(//home/runner/runners/**)",
                "Read(~/.claude.json)", "Read(~/.claude/**)", "Read(~/.config/**)",
                "Read(~/.gitconfig)", "Read(~/.git-credentials)", "Read(~/.netrc)",
                "Read(~/.ssh/**)", "Read(~/.docker/**)", "Read(~/.npmrc)",
                "Edit(\($tmp)/**)", "Write(\($tmp)/**)",
                "Edit(\($ws)/wiki/CLI-Reference.md)", "Edit(\($ws)/wiki/.lab/**)",
                "Edit(\($ws)/wiki/.git/**)",
                "Write(\($ws)/wiki/CLI-Reference.md)", "Write(\($ws)/wiki/.lab/**)",
                "Write(\($ws)/wiki/.git/**)"
              ]
            }
          }' > "$RUNNER_TEMP/wiki-daily-settings.json"
          echo "settings=$RUNNER_TEMP/wiki-daily-settings.json" >> "$GITHUB_OUTPUT"
          echo "prompt: $(cat repo/.github/prompts/wiki-daily.md context/run.md | wc -c) bytes"
          jq -c . "$RUNNER_TEMP/wiki-daily-settings.json"
          # The gate command runs from the workspace root, offline, never
          # re-syncing; `uv run` finds the venv through UV_PROJECT. The venv's
          # bin directory is not put on PATH: every later step, post steps
          # included, would look its tools up there first. It writes no
          # bytecode either, so a new .pyc under repo/ after the model is
          # never the gate's own.
          {
            echo "UV_PROJECT=${GITHUB_WORKSPACE}/repo"
            echo "UV_FROZEN=1"
            echo "UV_NO_SYNC=1"
            echo "UV_OFFLINE=1"
            echo "PYTHONDONTWRITEBYTECODE=1"
          } >> "$GITHUB_ENV"

      # With CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1 (job env), Claude Code refuses
      # to start without bubblewrap, which the runner image lacks (run
      # 38651487016). The action installs it only for allowed_non_write_users,
      # so it is installed here, the same way (action.yml at the pinned sha:
      # "Install subprocess isolation dependencies"). Ubuntu 24.04 blocks
      # unprivileged user namespaces through AppArmor, which bwrap needs
      # ("setting up uid map: Permission denied"); the restriction is lifted
      # only when the probe fails, and the step fails if bwrap still cannot
      # run, so the model never starts without the scrub. The sandbox also
      # needs socat; without it every Bash call fails, so the model could not
      # run the gate on its own edits (run 38790491412).
      - name: Install bubblewrap for the env scrub
        if: steps.secret.outputs.present == 'true'
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat && break
            if [ "$i" = 3 ]; then echo "::error::could not install bubblewrap and socat"; exit 1; fi
            sleep 5
          done
          if ! bwrap --ro-bind / / --dev /dev --proc /proc true; then
            if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
            if ! bwrap --ro-bind / / --dev /dev --proc /proc true; then
              echo "::error::bubblewrap cannot run for an unprivileged user; the env scrub cannot work"
              exit 1
            fi
          fi
          bwrap --version

      # Tools: read anything the deny list above leaves, edit and create only
      # inside wiki/, and run exactly one command: the gate on the wiki. The
      # rule has no wildcard, so it matches that command string and no other
      # (compound commands are split and each part must match). Command help
      # is in wiki/CLI-Reference.md. No git, no network tool; the commit and
      # push happen in `publish`, from page text only.
      - name: Improve the wiki (Claude)
        id: claude
        if: steps.secret.outputs.present == 'true'
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Agent mode takes a token instead of minting one through OIDC, so
          # the job needs no id-token permission; this one can only read.
          github_token: ${{ github.token }}
          settings: ${{ steps.prompt.outputs.settings }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model ${{ env.WIKI_MODEL }}
            --max-turns 90
            --allowedTools "Read,Grep,Glob,Edit(/${{ github.workspace }}/wiki/**),Write(/${{ github.workspace }}/wiki/**),Bash(uv run python repo/scripts/check_wiki.py wiki)"

      # Straight after the model, before anything runs repository code again:
      # every later step that does depends on this one, so when it fails
      # nothing from repo/ runs and nothing is pushed. It runs nothing from
      # repo/ itself: an absolute shell, the system PATH, and `git status`
      # only once the listing (which covers .git/config and hooks) matched,
      # with no global or system config and no fsmonitor. Its outcome is
      # never ignored (no continue-on-error), so improve fails with it.
      # It is a tripwire, not the gate: like every step after the model it
      # shares the model's runner, so a model past its permissions could
      # defeat it (M13-19). The gates run in `gates`, which trusts nothing
      # from this runner but the pages, as data, and step outcomes.
      - name: Nothing outside the wiki changed
        id: outside
        if: always() && steps.plan.outcome == 'success'
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        env:
          TREE: ${{ steps.before.outputs.tree }}
          STATUS: ${{ steps.before.outputs.status }}
        run: |
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          snapshot() {
            ( cd "$1" || exit 1
              list() { find . \( -path ./.git/objects -o -path ./.git/index \) -prune -o "$@" -print0 | LC_ALL=C sort -z; }
              list -type f | xargs -0 -r sha256sum --
              list -type f -perm -100 | while IFS= read -r -d '' p; do printf 'x %q\n' "$p"; done
              list -type l | while IFS= read -r -d '' p; do printf 'l %q %q\n' "$p" "$(readlink -- "$p")"; done
              list -type d | while IFS= read -r -d '' p; do printf 'd %q\n' "$p"; done
              list ! -type f ! -type d ! -type l | while IFS= read -r -d '' p; do printf 'o %q\n' "$p"; done
            )
          }
          status() { GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null git -C "$1" -c core.fsmonitor=false status --porcelain; }
          changed() {
            # The before listing is for reading only; the decision above used
            # the step output.
            diff "$RUNNER_TEMP/repo-$1-before" "$RUNNER_TEMP/repo-$1-after" | grep '^[<>]' | head -n 100 || true
            echo "::error::the checkout of main changed during the run ($2); nothing from it runs again and nothing is pushed"
            exit 1
          }
          # Claude Code stages an atomic write in <dir>/.claude/.cc-writes and
          # can leave both behind, empty (run 38805432999). Exactly those, and
          # only while empty, are removed: one holding anything survives and
          # fails the comparison; a symlink is not -type d. Main has no .claude
          # directory under repo/ here (the instruction-file step removed
          # every one before the snapshot), so nothing of main's goes.
          removed=$(
            {
              /usr/bin/find repo -depth -type d -name .cc-writes -path '*/.claude/.cc-writes' -empty -print -delete
              /usr/bin/find repo -depth -type d -name .claude -empty -print -delete
            } | wc -l
          )
          if [ "$removed" -gt 0 ]; then
            echo "removed $((removed)) empty .claude/.cc-writes or .claude directories left by Claude Code"
          fi
          snapshot repo > "$RUNNER_TEMP/repo-tree-after"
          if [ -z "$TREE" ] || [ "$(sha256sum < "$RUNNER_TEMP/repo-tree-after" | cut -c1-64)" != "$TREE" ]; then
            changed tree "a file under repo/, ignored paths included"
          fi
          status repo > "$RUNNER_TEMP/repo-status-after"
          if [ -z "$STATUS" ] || [ "$(sha256sum < "$RUNNER_TEMP/repo-status-after" | cut -c1-64)" != "$STATUS" ]; then
            changed status "git status"
          fi
          echo "repo/ is as it was before the model ran"

      # The action logs only a sanitised result line (no result text, no tool
      # output) unless show_full_output is on, and that prints every message
      # and tool result to this public log. Run 38653894587 failed with
      # is_error:true after 16 turns and nothing else to read. This prints a
      # bounded extract of the action's execution file instead: the result
      # text and the first tool errors, each through check_wiki's personal-data
      # matchers (scripts/wiki_diagnose.py). It reads that file only, runs only
      # when the Claude step did not succeed, and has a time limit, since the
      # text it matches is the model's. Only when repo/ is unchanged.
      - name: Diagnose the Claude step (redacted)
        if: ${{ !cancelled() && steps.secret.outputs.present == 'true' && steps.claude.outcome != 'success' && steps.outside.outcome == 'success' }}
        timeout-minutes: 3
        continue-on-error: true
        working-directory: repo
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          uv run --frozen python scripts/wiki_diagnose.py \
            "${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --workspace "$GITHUB_WORKSPACE" --temp "$RUNNER_TEMP" --home "$HOME"

      # The pages leave for the gates: everything else on this runner may be
      # the model's after it ran, so the judging happens on a fresh one. Only
      # the regular top-level pages, which is all that publish ever takes
      # (CLI-Reference.md among them, so the gates can check that the model
      # left it as generated), copied into handoff/: upload-artifact follows
      # symlinks, so a page that is a link is never read through. Other files
      # the model wrote are dropped here, unreported. No repository code.
      - name: Stage the pages for the gates
        id: stage
        if: always() && steps.plan.outcome == 'success' && steps.outside.outcome == 'success'
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          mkdir handoff
          find wiki -maxdepth 1 -type f -name '*.md' -exec cp -- {} handoff/ \;
          echo "$(find handoff -type f | wc -l) pages staged"
      # The hand-off artifact is public for a day, before the gates judge it,
      # so the pages leave only when check_wiki finds no personal data in the
      # staged copy (exit 0 or 1). This step can only withhold them, never
      # pass them: the gates run again on a fresh runner whatever it says. It
      # prints nothing of what it found, and fails (continue-on-error, so the
      # gates still report) when it withholds; its outcome tells gates why.
      - name: Withhold pages with personal data
        id: withhold
        if: always() && steps.stage.outcome == 'success' && steps.outside.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        working-directory: repo
        run: |
          code=0
          uv run --frozen python scripts/check_wiki.py ../handoff > /dev/null 2>&1 || code=$?
          if [ "$code" != 0 ] && [ "$code" != 1 ]; then
            echo "::error::check_wiki exited ${code} on the edited pages (3: personal data, 2: error); they are withheld"
            exit 1
          fi
      # Kept for one day only (the shortest retention); the gated copy is
      # wiki-daily-pages, from gates. Without overwrite: if an artifact of
      # this name already exists in the run, the upload fails, and improve
      # with it.
      - name: Hand the pages to the gates
        id: handoff
        if: always() && steps.withhold.outcome == 'success' && steps.outside.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiki-daily-unchecked
          path: handoff/
          if-no-files-found: error
          retention-days: 1
      # Post steps run after this one whatever the check decided, outside the
      # sandbox. actions/checkout's post runs git in repo/ (git config,
      # `submodule foreach ... sh -c`), and git reads repo/.git/config
      # (core.fsmonitor). It returns early when repo/.git/config is gone.
      # Removed as root, so a planted read-only directory (mode 0500) cannot
      # keep anything; rm does not follow a symlinked .git or .venv. Then it
      # asserts both are gone. The rest of repo/ stays: setup-uv's post reads
      # the project.
      - name: Leave nothing in repo/ for the post steps
        id: leave
        if: always()
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          /usr/bin/sudo /usr/bin/rm -rf -- repo/.git repo/.venv
          [ ! -e repo/.git ] && [ ! -L repo/.git ] && [ ! -e repo/.venv ] && [ ! -L repo/.venv ]

  # The gates, on a fresh runner (M13-19). Nothing of improve's runner
  # reaches this job: not its environment ($GITHUB_ENV is per job), not its
  # files, processes, tools or caches. It checks out main and clones the wiki
  # itself, installs from the lockfile with no cache (a cache entry is
  # runner state a model past its permissions could have written), and
  # takes from improve only the pages, as data, the outputs of the steps
  # before the model, and step outcomes. Its post steps (actions/checkout
  # and setup-uv) see only its own checkout of main.
  gates:
    name: Gate the edited wiki
    needs: improve
    # Whenever improve planned the run, whatever happened after: a failed
    # Claude step, a changed checkout or withheld pages still get a report.
    if: ${{ !cancelled() && needs.improve.outputs.plan == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.gate.outputs.changed }}
      # publish and report download by these ids, so an artifact of the same
      # name uploaded by anything else in the run is never the one taken.
      report_id: ${{ steps.report.outputs.artifact-id }}
      pages_id: ${{ steps.pages.outputs.artifact-id }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: repo
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install
        working-directory: repo
        run: uv sync --frozen
      # At the commit the pass started from, whatever the wiki holds now: the
      # gate measures the pass's change against it.
      - name: Clone the wiki at the commit the pass started from
        env:
          BASE: ${{ needs.improve.outputs.wiki_base }}
        run: |
          if ! [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::improve reported no wiki base commit"
            exit 1
          fi
          git clone --quiet "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.wiki.git" wiki
          git -C wiki -c advice.detachedHead=false checkout --quiet --detach "$BASE"
          mkdir -p report
      # A symlink among the wiki's own files would let page text be written
      # through it, into repo/ or anywhere else: only regular files and
      # directories, .git aside. The same step is in publish. The last setup
      # step, so its outcome says whether this job's setup succeeded.
      - name: The wiki holds only files and directories
        id: tree
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          odd=$(find wiki -path wiki/.git -prune -o ! -type f ! -type d -print -quit)
          if [ -n "$odd" ]; then
            echo "::error::the wiki holds a symlink or another special file; nothing is taken from this run"
            exit 1
          fi
      - name: Download the pages
        id: download
        if: needs.improve.outputs.handoff == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wiki-daily-unchecked
          path: incoming
      # The pages are data: only regular top-level .md files are taken, as in
      # publish, and each replaces what it lands on rather than writing
      # through it. CLI-Reference.md is the model's copy, which check_wiki
      # compares with what the generator renders now; .lab/state.json is the
      # base's, updated here.
      - name: Apply the pages
        id: apply
        if: needs.improve.outputs.handoff == 'success'
        working-directory: repo
        env:
          CLAUDE_RAN: ${{ needs.improve.outputs.claude_ran }}
          MAIN: ${{ needs.improve.outputs.main_sha }}
          REVIEW: ${{ needs.improve.outputs.review }}
        run: |
          find ../wiki -maxdepth 1 -type f -name '*.md' -delete
          find ../incoming -maxdepth 1 -type f -name '*.md' -exec cp --remove-destination -- {} ../wiki/ \;
          if [ "$CLAUDE_RAN" = true ]; then
            uv run --frozen python scripts/wiki_state.py update --wiki ../wiki --main "$MAIN" --reviewed "$REVIEW" --date "$(date -u +%F)"
          fi
      # Exit codes (scripts/check_wiki.py): 0 clean, 1 failures, 3 failures
      # including personal data, 2 error. Only 0 and 1 let artifacts out.
      - name: Gate - check_wiki
        id: check
        if: always() && steps.apply.outcome == 'success'
        working-directory: repo
        env:
          BASE: ${{ needs.improve.outputs.wiki_base }}
        run: |
          code=0
          uv run --frozen python scripts/check_wiki.py ../wiki --base "$BASE" > ../report/check.txt || code=$?
          cat ../report/check.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Install gitleaks
        if: always() && steps.apply.outcome == 'success'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
      # gitleaks reads the whole change; the artifact's diff holds only the
      # top-level pages (the `:(glob)` pathspec does not descend).
      - name: Gate - gitleaks on the wiki diff
        id: gitleaks
        if: always() && steps.apply.outcome == 'success'
        continue-on-error: true
        env:
          BASE: ${{ needs.improve.outputs.wiki_base }}
        run: |
          git -C wiki add -A
          git -C wiki diff --cached "$BASE" > "$RUNNER_TEMP/wiki-full.diff"
          git -C wiki diff --cached "$BASE" -- ':(glob)*.md' > report/wiki.diff
          gitleaks stdin --redact --no-banner --exit-code 1 --config repo/.gitleaks.toml < "$RUNNER_TEMP/wiki-full.diff"
      # When the checkout of main changed while the model ran, improve
      # withheld the pages, this job's setup failed, or the pages never
      # arrived, the gate does not run: this writes a fixed reason, naming the
      # first cause, as the gate report (the issue quotes it) and fails,
      # running nothing else.
      - name: Gate result
        id: gate
        if: always()
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        env:
          OUTSIDE: ${{ needs.improve.outputs.outside }}
          WITHHOLD: ${{ needs.improve.outputs.withhold }}
          HANDOFF: ${{ needs.improve.outputs.handoff }}
          SETUP: ${{ steps.tree.outcome }}
          DOWNLOAD: ${{ steps.download.outcome }}
          APPLY: ${{ steps.apply.outcome }}
          CODE: ${{ steps.check.outputs.code }}
          LEAKS: ${{ steps.gitleaks.outcome }}
          CLAUDE: ${{ needs.improve.outputs.claude }}
          BASE: ${{ needs.improve.outputs.wiki_base }}
        run: |
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          if [ "$OUTSIDE" = failure ]; then
            reason="the checkout of main changed outside the wiki while the model ran"
          elif [ "$OUTSIDE" != success ]; then
            reason="the check that nothing outside the wiki changed did not finish (step \"Nothing outside the wiki changed\": ${OUTSIDE:-not run})"
          elif [ "$WITHHOLD" = failure ]; then
            reason="improve withheld the pages: check_wiki found personal data in them, or could not check them"
          elif [ "$WITHHOLD" != success ]; then
            reason="improve could not stage the pages (step \"Withhold pages with personal data\": ${WITHHOLD:-not run})"
          elif [ "$HANDOFF" != success ]; then
            reason="improve did not hand the pages on (step \"Hand the pages to the gates\": ${HANDOFF:-not run})"
          elif [ "$SETUP" != success ]; then
            reason="this job's setup failed (checkout, install, the wiki clone or its file check: ${SETUP:-not run}; see the run log)"
          elif [ "$DOWNLOAD" != success ]; then
            reason="the pages did not reach the gate (step \"Download the pages\": ${DOWNLOAD:-not run})"
          elif [ "$APPLY" != success ]; then
            reason="the pages could not be applied (step \"Apply the pages\": ${APPLY:-not run})"
          else
            reason=
          fi
          if [ -n "$reason" ]; then
            mkdir -p report
            rm -f report/check.txt
            echo "check_wiki did not run: ${reason}. Nothing is pushed." > report/check.txt
            echo "report=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Wiki daily"
              echo
              echo "- Claude step: ${CLAUDE:-skipped}"
              echo "- the gate did not run: ${reason}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::the gate did not run; nothing is pushed"
            exit 1
          fi
          # The report leaves only when check_wiki found no personal data; the
          # pages and the diff only when, besides, gitleaks found nothing.
          if [ "$CODE" = 0 ] || [ "$CODE" = 1 ]; then
            echo "report=true" >> "$GITHUB_OUTPUT"
            if [ "$LEAKS" = success ]; then echo "pages=true" >> "$GITHUB_OUTPUT"; fi
          fi
          if git -C wiki diff --cached --quiet "$BASE"; then changed=false; else changed=true; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          {
            echo "### Wiki daily"
            echo
            echo "- Claude step: ${CLAUDE:-skipped}"
            echo "- check_wiki exit: ${CODE:-none}; gitleaks: $LEAKS; wiki changed: $changed"
            echo
            echo '```text'
            cat report/check.txt
            # File names may be personal data too: listed only when clean.
            if [ "$CODE" = 0 ] || [ "$CODE" = 1 ]; then git -C wiki diff --cached --stat "$BASE"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" != 0 ] || [ "$LEAKS" != success ]; then
            echo "::error::the gate rejected the wiki; nothing is pushed"
            exit 1
          fi
      - name: Upload the gate report
        id: report
        if: always() && steps.gate.outputs.report == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiki-daily-report
          path: report/check.txt
          if-no-files-found: ignore
          retention-days: 14
      # Regular files only, copied into a folder of their own: upload-artifact
      # follows symlinks. The layout publish reads: wiki/*.md, report/wiki.diff.
      - name: Stage the pages and the wiki diff
        id: stage
        if: always() && steps.gate.outputs.pages == 'true'
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          mkdir -p out/wiki out/report
          find wiki -maxdepth 1 -type f -name '*.md' -exec cp -- {} out/wiki/ \;
          cp -- report/wiki.diff out/report/wiki.diff
      - name: Upload the pages and the wiki diff
        id: pages
        if: always() && steps.gate.outputs.pages == 'true' && steps.stage.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiki-daily-pages
          path: out/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Push the wiki
    needs: [improve, gates]
    # Never from a branch; never until the owner sets WIKI_DAILY_PUBLISH; and
    # a dispatch only with push: true. Only after improve and gates both
    # succeeded; stated explicitly because the implicit check would also skip
    # this job when previous-report, which improve does not depend on for
    # success, failed.
    if: >-
      github.ref == 'refs/heads/main' &&
      !cancelled() && needs.improve.result == 'success' &&
      needs.gates.result == 'success' &&
      vars.WIKI_DAILY_PUBLISH == 'true' &&
      needs.gates.outputs.changed == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.push))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only the push step uses this token's write access (see the header).
    permissions:
      contents: write
    steps:
      - name: Check out main at the commit the pass read
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.improve.outputs.main_sha }}
          path: repo
          persist-credentials: false
      # No cache, as in gates: an entry is runner state that a model past its
      # permissions in improve could have written, and this job can push.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install
        working-directory: repo
        run: uv sync --frozen
      - name: Clone the wiki at the commit the pass started from
        env:
          BASE: ${{ needs.improve.outputs.wiki_base }}
        run: |
          git clone --quiet "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.wiki.git" wiki
          if [ "$(git -C wiki rev-parse HEAD)" != "$BASE" ]; then
            echo "::error::the wiki changed while the pass ran; nothing is pushed (the next run starts from the new wiki)"
            exit 1
          fi
      # As in gates: no symlink in the wiki for page text to be written through.
      - name: The wiki holds only files and directories
        id: tree
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          odd=$(find wiki -path wiki/.git -prune -o ! -type f ! -type d -print -quit)
          if [ -n "$odd" ]; then
            echo "::error::the wiki holds a symlink or another special file; nothing is taken from this run"
            exit 1
          fi
      # The pages gates passed, by the id its upload returned.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.gates.outputs.pages_id }}
          path: incoming
      # The pages are data: only regular top-level .md files are taken. The
      # generated page and the state file are rebuilt here, not taken.
      - name: Apply the pages
        working-directory: repo
        env:
          CLAUDE_RAN: ${{ needs.improve.outputs.claude_ran }}
          MAIN: ${{ needs.improve.outputs.main_sha }}
          REVIEW: ${{ needs.improve.outputs.review }}
        run: |
          find ../wiki -maxdepth 1 -type f -name '*.md' -delete
          find ../incoming/wiki -maxdepth 1 -type f -name '*.md' -exec cp --remove-destination -- {} ../wiki/ \;
          uv run --frozen python scripts/gen_command_reference.py --out ../wiki/CLI-Reference.md
          if [ "$CLAUDE_RAN" = true ]; then
            uv run --frozen python scripts/wiki_state.py update --wiki ../wiki --main "$MAIN" --reviewed "$REVIEW" --date "$(date -u +%F)"
          fi
      - name: Gate again - check_wiki
        working-directory: repo
        env:
          BASE: ${{ needs.improve.outputs.wiki_base }}
        run: uv run --frozen python scripts/check_wiki.py ../wiki --base "$BASE"
      - name: Commit
        id: commit
        run: |
          git -C wiki add -A
          if git -C wiki diff --cached --quiet; then
            echo "Nothing to push."
            echo "made=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -C wiki -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "wiki: daily pass $(date -u +%F) (run ${GITHUB_RUN_ID})"
          echo "made=true" >> "$GITHUB_OUTPUT"
      - name: Install gitleaks
        if: steps.commit.outputs.made == 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
      - name: Gate again - gitleaks on the commit
        if: steps.commit.outputs.made == 'true'
        env:
          BASE: ${{ needs.improve.outputs.wiki_base }}
        run: gitleaks git wiki --log-opts="${BASE}..HEAD" --redact --no-banner --exit-code 1 --config repo/.gitleaks.toml
      # The token reaches git only through a credential helper for this one
      # push. HELPER is literal text naming $TOKEN; git's helper shell expands
      # it and hands the token to git over a pipe. No value is derived from
      # the token, so nothing needs masking, and the token is never in argv,
      # a remote URL, a file or the log. The empty helper first drops any
      # helper the runner configured. No force: if the wiki moved, the push
      # fails and the issue says so.
      - name: Push
        if: steps.commit.outputs.made == 'true'
        env:
          TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.improve.outputs.wiki_branch }}
          HELPER: '!f() { test "$1" = get || return 0; echo username=x-access-token; printf "password=%s\n" "$TOKEN"; }; f'
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git -C wiki -c credential.helper= -c "credential.helper=${HELPER}" \
            push --quiet origin "HEAD:refs/heads/${BRANCH}"

  report:
    name: Report a failure
    needs: [improve, gates, publish]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      # Present only when the gate found no personal data (see "Gate result").
      # By the id gates' upload returned: an artifact of the same name from
      # anywhere else in the run never reaches the issue.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.gates.outputs.report_id != ''
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.gates.outputs.report_id }}
          path: report
      - name: Open or comment on the wiki-daily issue
        env:
          GH_TOKEN: ${{ github.token }}
          IMPROVE: ${{ needs.improve.result }}
          GATES: ${{ needs.gates.result }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "The daily wiki pass of $(date -u +%F) failed, and nothing was pushed to the wiki."
            echo
            echo "- improve: ${IMPROVE}"
            echo "- gate: ${GATES}"
            echo "- push: ${PUBLISH}"
            echo "- run: ${run_url}"
            echo
            echo "Gate report (scripts/check_wiki.py; personal data is named by kind, never quoted):"
            echo
            echo '~~~~text'
            if [ -s report/check.txt ]; then head -c 50000 report/check.txt; else echo "(no gate report: withheld because it found personal data, or the run stopped earlier; see the run log)"; fi
            echo '~~~~'
          } > "$RUNNER_TEMP/body.md"
          gh label create wiki-daily --repo "$GITHUB_REPOSITORY" --color D93F0B \
            --description "The daily wiki job failed" 2>/dev/null || true
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label wiki-daily --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label wiki-daily \
              --title "wiki-daily: the daily wiki pass failed" --body-file "$RUNNER_TEMP/body.md"
          fi
