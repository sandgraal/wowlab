name: Claude

# Interactive responder: a collaborator mentions @claude in an issue or PR
# comment and it answers with the repo's AGENTS.md context loaded. It reads
# and comments. The job's own token is read-only on contents, but the pinned
# action mints a GitHub App token (contents, pull-requests and issues: write)
# for its own tools; with use_commit_signing the model's only write path is
# the action's commit tool, onto the branch the action set up, never a shell
# git. Needs the CLAUDE_CODE_OAUTH_TOKEN repository secret, a token for the
# owner's Claude subscription (docs/SETUP.md); the job skips cleanly without
# it. Every run counts against that subscription's usage limits.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: >-
      github.actor != 'dependabot[bot]' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.issue.author_association) && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      # Claude Code strips credentials, CLAUDE_CODE_OAUTH_TOKEN among them,
      # from the environment of every command it runs, and runs Bash in its
      # own PID namespace so /proc shows no other process (owner decision
      # 2026-10-14, round 2). GitHub tokens stay, so `gh` keeps working.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      - name: Check secret
        id: secret
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "CLAUDE_CODE_OAUTH_TOKEN is not set; skipping (see docs/SETUP.md)"; echo "present=false" >> "$GITHUB_OUTPUT"; fi
      # A fork's PR is someone else's code and text: the responder does not
      # run on one, even when a collaborator mentions @claude on it (security
      # review of #180, F1). Only PR events ask GitHub; on a plain issue this
      # step is skipped, its output is empty, and the steps below still run.
      # Anything but a plain true or false from gh fails the job.
      - name: Check the PR is not from a fork
        id: fork
        if: >-
          steps.secret.outputs.present == 'true' && (
            github.event_name == 'pull_request_review_comment' ||
            (github.event_name == 'issue_comment' && github.event.issue.pull_request)
          )
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          cross=$(gh pr view "$N" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)
          case "$cross" in
            true) echo "PR #${N} comes from a fork; skipping" ;;
            false) ;;
            *) echo "::error::could not tell whether PR #${N} comes from a fork"; exit 1 ;;
          esac
          echo "cross_repo=${cross}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secret.outputs.present == 'true' && steps.fork.outputs.cross_repo != 'true'
        with:
          fetch-depth: 1
          persist-credentials: false

      # With CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1 (job env), Claude Code refuses
      # to start without bubblewrap, which the runner image lacks (run
      # 38651487016). The action installs it only for allowed_non_write_users,
      # so it is installed here, the same way (action.yml at the pinned sha:
      # "Install subprocess isolation dependencies"). Ubuntu 24.04 blocks
      # unprivileged user namespaces through AppArmor, which bwrap needs
      # ("setting up uid map: Permission denied"); the restriction is lifted
      # only when the probe fails, and the step fails if bwrap still cannot
      # run, so the model never starts without the scrub.
      - name: Install bubblewrap for the env scrub
        if: steps.secret.outputs.present == 'true' && steps.fork.outputs.cross_repo != 'true'
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat && break
            if [ "$i" = 3 ]; then echo "::error::could not install bubblewrap and socat"; exit 1; fi
            sleep 5
          done
          if ! bwrap --ro-bind / / --dev /dev --proc /proc true; then
            if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
            if ! bwrap --ro-bind / / --dev /dev --proc /proc true; then
              echo "::error::bubblewrap cannot run for an unprivileged user; the env scrub cannot work"
              exit 1
            fi
          fi
          bwrap --version

      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        if: steps.secret.outputs.present == 'true' && steps.fork.outputs.cross_repo != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Commits, if any, go through the action's file tools
          # (mcp__github_file_ops__*) instead of shell git add/commit/push.
          use_commit_signing: true
          # Only the owner's comments, and the action's own, reach the prompt;
          # the input matches logins, not author associations.
          include_comments_by_actor: ${{ github.repository_owner }},claude[bot]
          # Deny rules win over every allow rule. `//` starts an absolute path;
          # `./` is the workspace; with use_commit_signing the action writes
          # its App token (contents: write) into the checkout's .git/config.
          settings: |
            {
              "permissions": {
                "disableBypassPermissionsMode": "disable",
                "deny": [
                  "WebFetch", "WebSearch", "NotebookEdit", "Task", "Agent",
                  "Read(./.git/config)",
                  "Read(//proc/**)", "Read(//sys/**)", "Read(//etc/**)", "Read(//root/**)",
                  "Read(/${{ runner.temp }}/**)",
                  "Read(//home/runner/actions-runner/**)", "Read(//home/runner/runners/**)",
                  "Read(~/.claude.json)", "Read(~/.claude/**)", "Read(~/.config/**)",
                  "Read(~/.gitconfig)", "Read(~/.git-credentials)", "Read(~/.netrc)",
                  "Read(~/.ssh/**)", "Read(~/.docker/**)", "Read(~/.npmrc)"
                ]
              }
            }
          # Model pinned by full id, as in claude-review.yml.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "Read,Grep,Glob"
