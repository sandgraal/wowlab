name: Claude

# Interactive responder: a collaborator mentions @claude in an issue or PR
# comment and it answers with the repo's AGENTS.md context loaded. Read-only
# on the repository; it comments, it does not push. Needs the
# CLAUDE_CODE_OAUTH_TOKEN repository secret, a token for the owner's Claude
# subscription (docs/SETUP.md); the job skips cleanly without it. Every run
# counts against that subscription's usage limits.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: >-
      github.actor != 'dependabot[bot]' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.issue.author_association) && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Check secret
        id: secret
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "CLAUDE_CODE_OAUTH_TOKEN is not set; skipping (see docs/SETUP.md)"; echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secret.outputs.present == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        if: steps.secret.outputs.present == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Model pinned by full id, as in claude-review.yml.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "Read,Grep,Glob"
