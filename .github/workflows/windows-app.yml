name: Windows app

# Builds and smoke-tests the Windows app (M17-09, ADR-0038) without a release:
# on a pull request that changes what the app is built from, and by hand
# (workflow_dispatch) on any branch. It publishes nothing, holds no secret
# and writes nothing outside its own artifacts; the zip it uploads is kept
# seven days for a person to try. The release itself builds the app in
# release.yml, from the tag's wheel, with the same steps as the
# `windows_app` and `windows_app_smoke` jobs below
# (tests/packaging/test_windows_app.py holds the two to the same steps);
# here the wheel is built from the checked-out commit, exactly as
# release.yml's `build` job builds it.
on:
  pull_request:
    branches: [main]
    paths:
      - "packaging/**"
      - "scripts/app_smoke.py"
      - "scripts/record_url.py"
      - ".github/workflows/windows-app.yml"
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.12"
  PYTHON_VERSION: "3.12"

jobs:
  wheel:
    name: Build the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.wheel.outputs.version }}
      wheel: ${{ steps.wheel.outputs.wheel }}
      wheel_sha256: ${{ steps.wheel.outputs.wheel_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: uv build
        run: >-
          uv build --package wowlab-core --no-sources --no-create-gitignore
          --build-constraints lab/core/build-constraints.txt --require-hashes
          --out-dir "$RUNNER_TEMP/dist"
      - name: The wheel, its version and its SHA-256
        id: wheel
        run: |
          version="$(uv run --isolated --no-project --python "$PYTHON_VERSION" -- python -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' lab/core/pyproject.toml)"
          wheel="wowlab_core-$version-py3-none-any.whl"
          mkdir release
          cp "$RUNNER_TEMP/dist/$wheel" release/
          {
            echo "version=$version"
            echo "wheel=$wheel"
            echo "wheel_sha256=$(sha256sum -- "release/$wheel" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  windows_app:
    name: Build the Windows app
    needs: wheel
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    outputs:
      app_sha256: ${{ steps.zip.outputs.app_sha256 }}
    env:
      VERSION: ${{ needs.wheel.outputs.version }}
      WHEEL: ${{ needs.wheel.outputs.wheel }}
      WHEEL_SHA256: ${{ needs.wheel.outputs.wheel_sha256 }}
      APP_ZIP: wowlab-${{ needs.wheel.outputs.version }}-windows-x64.zip
    steps:
      # The spec, the launcher and uv.lock come from the checked-out commit;
      # the code that is frozen comes from the wheel only (ADR-0038 item 2).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: The wheel is the one the build hashed
        run: |
          printf '%s  %s\n' "$WHEEL_SHA256" "$WHEEL" > "$RUNNER_TEMP/expected-wheel"
          test "$(grep -Ecx '[0-9a-f]{64}  [^ ]+' "$RUNNER_TEMP/expected-wheel")" -eq 1
          cd "$RUNNER_TEMP/release"
          sha256sum -c "$RUNNER_TEMP/expected-wheel"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # As in `app`: the wheel's dependencies at the versions uv.lock pins,
      # with their hashes, PyInstaller from the `packaging` group, then the
      # wheel; the Python frozen into the app is uv's own build of 3.12.
      - name: A clean virtual environment with the wheel and PyInstaller
        run: |
          uv export --frozen --package wowlab-core --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/runtime.txt"
          uv export --frozen --only-group packaging --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/packaging.txt"
          uv venv --managed-python --python "$PYTHON_VERSION" "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/Scripts/python.exe" --require-hashes -r "$RUNNER_TEMP/runtime.txt" -r "$RUNNER_TEMP/packaging.txt"
          uv pip install --python "$RUNNER_TEMP/venv/Scripts/python.exe" --no-deps "$RUNNER_TEMP/release/$WHEEL"
      # Run outside the checkout, so nothing of the working tree is on the
      # path PyInstaller analyses but packaging/ itself. One folder: the
      # executable beside `_internal`, never a single self-unpacking file;
      # and an x64 executable (the PE header's machine field is 0x8664).
      - name: PyInstaller, one folder, no UPX
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/Scripts/pyinstaller.exe" --noconfirm --clean --distpath "$RUNNER_TEMP/dist" --workpath "$RUNNER_TEMP/work" "$GITHUB_WORKSPACE/packaging/wowlab.spec"
          test -f "$RUNNER_TEMP/dist/wowlab/wowlab.exe"
          test -d "$RUNNER_TEMP/dist/wowlab/_internal"
          "$RUNNER_TEMP/venv/Scripts/python.exe" -I -c 'import struct, sys; d = open(sys.argv[1], "rb").read(4096); o = struct.unpack_from("<I", d, 60)[0]; assert d[o:o + 4] == b"PE\0\0" and struct.unpack_from("<H", d, o + 4)[0] == 0x8664, "not an x64 executable"' "$RUNNER_TEMP/dist/wowlab/wowlab.exe"
      # The zip holds the one folder, `wowlab/`, with forward-slash names, as
      # Python's zipfile writes it (Git for Windows has no zip command).
      - name: Zip the app and record its SHA-256
        id: zip
        working-directory: ${{ runner.temp }}/dist
        run: |
          mkdir "$RUNNER_TEMP/app"
          "$RUNNER_TEMP/venv/Scripts/python.exe" -I -m zipfile -c "$RUNNER_TEMP/app/$APP_ZIP" wowlab
          echo "app_sha256=$(sha256sum "$RUNNER_TEMP/app/$APP_ZIP" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-app
          path: ${{ runner.temp }}/app/
          if-no-files-found: error
          retention-days: 7

  windows_app_smoke:
    name: Smoke-test the Windows app
    needs: [wheel, windows_app]
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.wheel.outputs.version }}
      APP_ZIP: wowlab-${{ needs.wheel.outputs.version }}-windows-x64.zip
      APP_SHA256: ${{ needs.windows_app.outputs.app_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-app
          path: ${{ runner.temp }}/app
      - name: The zip is the one the build hashed
        run: |
          printf '%s  %s\n' "$APP_SHA256" "$APP_ZIP" > "$RUNNER_TEMP/expected-app"
          test "$(grep -Ecx '[0-9a-f]{64}  [^ ]+' "$RUNNER_TEMP/expected-app")" -eq 1
          cd "$RUNNER_TEMP/app"
          sha256sum -c "$RUNNER_TEMP/expected-app"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Unzip it and run the smoke test
        run: |
          mkdir "$RUNNER_TEMP/unzipped"
          uv run --isolated --no-project --python "$PYTHON_VERSION" -- python -I -m zipfile -e "$RUNNER_TEMP/app/$APP_ZIP" "$RUNNER_TEMP/unzipped"
          uv run --isolated --no-project --python "$PYTHON_VERSION" -- python scripts/app_smoke.py --exe "$RUNNER_TEMP/unzipped/wowlab/wowlab.exe" --version "$VERSION"
