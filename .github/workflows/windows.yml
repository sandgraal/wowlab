name: Windows

# The Lab suite on windows-latest (ADR-0031, M13-02). It covers the path
# behaviour Linux and macOS cannot show: junctions, case-insensitive name
# collisions, reserved names, `\\?\` long paths, files held open
# (docs/LAB_PLAN.md §9; the first run caught the byte-0 lock bug on PR #59).
#
# Off the PR path (owner decision, ADR-0014 amendment of 2026-10-15): the job
# took 15 to 30 minutes and every PR waited on it. It runs after each merge to
# main, nightly, and on demand for a branch:
#   gh workflow run windows.yml --ref <branch>
# It is not a required check. A red run on main is a bug to fix next, filed
# as a ticket, not a reason to revert. The conductor checks the latest runs
# on main at the start of each /conduct session and before a wave review
# (.claude/skills/conduct/SKILL.md, docs/AGENT_WORKFLOW.md).

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Runs on main queue rather than cancel, so each merge gets its own verdict;
# a superseded on-demand branch run is cancelled.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_VERSION: "0.12.12"
  PYTHON_VERSION: "3.12"

jobs:
  lab-windows:
    name: lab (windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Record whether long paths are enabled (test_desktop_paths)
        shell: pwsh
        run: |
          "LongPathsEnabled=" + (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem').LongPathsEnabled
      # Two passes (M13-18): everything not `serial` across the runner's
      # cores, then the RSS and CPU-time budget tests (`serial`, marked in
      # conftest.py) alone. A command-line -m replaces the one in addopts,
      # so both keep `not live`.
      - name: pytest lab/core/tests (parallel)
        run: uv run --frozen pytest -q -n auto --dist worksteal -m "not live and not serial" lab/core/tests
      - name: pytest lab/core/tests (serial)
        run: uv run --frozen pytest -q -m "serial and not live" lab/core/tests
      - name: wowlab --version
        run: uv run --frozen wowlab --version
