name: Windows

# The Lab suite on windows-latest (ADR-0031, M13-02). It covers the path
# behaviour Linux and macOS cannot show: junctions, case-insensitive name
# collisions, reserved names, `\\?\` long paths, files held open
# (docs/LAB_PLAN.md §9; the first run caught the byte-0 lock bug on PR #59).
#
# Not a required check (owner decisions, ADR-0014 amendments of 2026-10-15 and
# 2026-10-17): the job took 15 to 30 minutes and every PR waited on it. It runs
# after each merge to main, nightly, on demand for a branch:
#   gh workflow run windows.yml --ref <branch>
# and on a pull request that touches lab/, the lockfile, the root pyproject,
# the root conftest or this file, so a POSIX-only test assumption shows on the
# PR; nothing waits on it. A red run on main is a bug to fix next, filed
# as a ticket, not a reason to revert. The conductor checks the latest runs
# on main at the start of each /conduct session and before a wave review
# (.claude/skills/conduct/SKILL.md, docs/AGENT_WORKFLOW.md).

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "lab/**"
      - "uv.lock"
      - "pyproject.toml"
      - "conftest.py"
      - ".github/workflows/windows.yml"
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Runs on main queue rather than cancel, so each merge gets its own verdict;
# a superseded pull-request or on-demand branch run is cancelled.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_VERSION: "0.12.12"
  PYTHON_VERSION: "3.12"

jobs:
  lab-windows:
    name: lab (windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Record whether long paths are enabled (test_desktop_paths)
        shell: pwsh
        run: |
          "LongPathsEnabled=" + (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem').LongPathsEnabled
      # Two passes (M13-18): everything not `serial` across the runner's
      # cores, then the RSS and CPU-time budget tests (`serial`, marked in
      # conftest.py) alone. A command-line -m replaces the one in addopts,
      # so both keep `not live`.
      - name: pytest lab/core/tests (parallel)
        run: uv run --frozen pytest -q -n auto --dist worksteal -m "not live and not serial" lab/core/tests
      - name: pytest lab/core/tests (serial)
        run: uv run --frozen pytest -q -m "serial and not live" lab/core/tests
      # Long paths off (M13-15T): the default on many player PCs. The runner
      # image turns them on, so the module skips in the passes above. These
      # steps run whatever the passes above did, turn the setting off for new
      # processes, run that one module alone (it errors rather than skipping
      # if plain long paths still work), and turn the setting back on.
      - name: Turn long paths off
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 0 -Type DWord
          "LongPathsEnabled=" + (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem').LongPathsEnabled
      - name: pytest test_long_paths_windows.py (long paths off)
        if: ${{ !cancelled() }}
        env:
          WOWLAB_EXPECT_LONG_PATHS_OFF: "1"
        run: uv run --frozen pytest -q -rxXs -m "not live" lab/core/tests/test_long_paths_windows.py
      - name: Turn long paths back on
        if: ${{ always() }}
        shell: pwsh
        run: |
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1 -Type DWord
      - name: wowlab --version
        run: uv run --frozen wowlab --version
