name: Windows

# The Lab suite on windows-latest (ADR-0031, M13-02). It covers the path
# behaviour Linux and macOS cannot show: junctions, case-insensitive name
# collisions, reserved names, `\\?\` long paths, files held open
# (docs/LAB_PLAN.md §9; the first run caught the byte-0 lock bug on PR #59).
#
# Not a required check (owner decisions, ADR-0014 amendments of 2026-10-15 and
# 2026-10-17): the job took 15 to 30 minutes and every PR waited on it. It runs
# nightly and on demand for a branch:
#   gh workflow run windows.yml --ref <branch>
# It also ran after each merge to main until 2026-11-18, when the owner made
# it nightly only (M15-21): a run took 34 to 44 minutes, a burst of merges
# queued them, and the result was not read within the day anyway. The night
# run is at 09:17 UTC, 03:17 in the owner's local time (UTC-6, no daylight time), inside
# the owner's quiet hours; GitHub can start it 30 to 60 minutes late.
# From 2026-10-17 to 2026-11-17 it also ran on a pull request that touched
# lab/, the lockfile, the root pyproject, the root conftest or this file; the
# owner took it off pull requests again on 2026-11-17 (M18-15; about 44
# minutes a run), with macOS (macos.yml). A failed scheduled run is emailed
# to the owner by GitHub's default notification settings; nothing here posts
# anywhere. A red run on main is a bug to fix next, filed
# as a ticket, not a reason to revert. The conductor checks the latest runs
# on main at the start of each /conduct session and before a wave review
# (.claude/skills/conduct/SKILL.md, docs/AGENT_WORKFLOW.md).

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A run in progress on main is never cancelled. GitHub keeps at most one running and one
# pending run per group, and a newer queued run replaces the pending one.
# The nightly run has a group of its own (M18-15), so an on-demand run never
# replaces it and it never replaces one. A superseded on-demand branch run is
# cancelled. (Merges to main started a run here until 2026-11-18, M15-21.)
concurrency:
  group: windows-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.ref != 'refs/heads/main' }}

env:
  UV_VERSION: "0.12.12"
  PYTHON_VERSION: "3.12"

jobs:
  lab-windows:
    name: lab (windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No Actions cache, restored or saved (M13-42; see the note in ci.yml).
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install
        run: uv sync --frozen
      - name: Record whether long paths are enabled (test_desktop_paths)
        shell: pwsh
        run: |
          "LongPathsEnabled=" + (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem').LongPathsEnabled
      # Two passes (M13-18): everything not `serial` across the runner's
      # cores, then the RSS and CPU-time budget tests (`serial`, marked in
      # conftest.py) alone. A command-line -m replaces the one in addopts,
      # so both keep `not live`. `-rs` prints every skipped test with its
      # reason, so a Windows-only test that skipped shows in the log rather
      # than only as a lower pass count (M13-65).
      - name: pytest lab/core/tests (parallel)
        run: uv run --frozen pytest -q -rs -n auto --dist worksteal -m "not live and not serial" lab/core/tests
      - name: pytest lab/core/tests (serial)
        run: uv run --frozen pytest -q -rs -m "serial and not live" lab/core/tests
      # Long paths off (M13-15T): the default on many player PCs. The runner
      # image turns them on, so the module skips in the passes above. These
      # steps run whatever the passes above did, turn the setting off for new
      # processes, run those modules alone (M13-15T's graders, and M13-44's
      # tests of the readers it left; each errors rather than skipping if
      # plain long paths still work), and turn the setting back on.
      - name: Turn long paths off
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 0 -Type DWord
          "LongPathsEnabled=" + (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem').LongPathsEnabled
      - name: pytest test_long_paths_windows.py test_long_paths_readers.py (long paths off)
        if: ${{ !cancelled() }}
        env:
          WOWLAB_EXPECT_LONG_PATHS_OFF: "1"
        run: uv run --frozen pytest -q -rxXs -m "not live" lab/core/tests/test_long_paths_windows.py lab/core/tests/test_long_paths_readers.py
      - name: Turn long paths back on
        if: ${{ always() }}
        shell: pwsh
        run: |
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1 -Type DWord
      - name: wowlab --version
        run: uv run --frozen wowlab --version
