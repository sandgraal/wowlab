  # M16-32 (ADR-0031, amendment of 2026-10-21): the same wheel and sdist, the
  # files `build` made and `release` published, go to PyPI as well, so
  # `uvx --from wowlab-core wowlab doctor` works (the project on PyPI is
  # named as in lab/core/pyproject.toml). Trusted publishing: PyPI
  # trusts an OIDC token for this repository, this workflow file and the
  # `release` environment, and nothing else; there is no API token and no
  # secret. The job runs in `environment: release`, so it waits for the
  # owner's approval like `release` does, and the PyPI trusted publisher is
  # bound to that environment, so the app attach jobs, which hold
  # `id-token: write` with no environment, cannot publish to PyPI
  # (docs/handoffs/M16-32-pypi.md). After `release`: a version reaches PyPI
  # only once its GitHub Release is out, and a PyPI upload, which can never
  # be replaced, is the last thing done with the files. Like `release`, it
  # checks out nothing and runs no repository code: it checks the two files
  # against the hashes `build` recorded and hands exactly those two to the
  # pinned publishing action, which also attaches PEP 740 attestations.
  pypi:
    name: Publish the wheel and the sdist to PyPI
    needs: [version, build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write # trusted publishing: the OIDC token PyPI exchanges for a short-lived upload token
    env:
      WHEEL: ${{ needs.version.outputs.wheel }}
      SDIST: ${{ needs.version.outputs.sdist }}
      WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
      SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      # Checked against the build job's outputs, not against the artifact's
      # own SHA256SUMS. Only the two files are copied to dist/, the folder the
      # action uploads whole, and they are checked again there.
      - name: The files are the ones the build hashed
        run: |
          printf '%s  %s\n' "$WHEEL_SHA256" "$WHEEL" "$SDIST_SHA256" "$SDIST" > "$RUNNER_TEMP/expected"
          test "$(grep -Ecx '[0-9a-f]{64}  [^ ]+' "$RUNNER_TEMP/expected")" -eq 2
          (cd release && sha256sum -c "$RUNNER_TEMP/expected")
          mkdir dist
          cp -- "release/$WHEEL" "release/$SDIST" dist/
          cd dist
          sha256sum -c "$RUNNER_TEMP/expected"
          test "$(find . -mindepth 1 | wc -l)" -eq 2
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          print-hash: true
