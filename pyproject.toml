# Workspace root. Not a package itself; it pins the toolchain and lints every
# Python project in the repository with one configuration.
[project]
name = "wowlab-workspace"
version = "0.0.0"
description = "wowlab repository root (uv workspace)"
requires-python = ">=3.12"
dependencies = ["wowlab-core"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["lab/core"]

[tool.uv.sources]
wowlab-core = { workspace = true }

[dependency-groups]
dev = [
  "ruff==0.17.4",
  "mypy>=1.19",
  "pytest>=8.4",
  "pytest-xdist>=3.8",  # dev only: `make test` and CI run the suite in parallel (M13-18)
  "pytest-timeout>=2.3",  # dev only: a hung test fails after `timeout` seconds (M13-81)
  "pre-commit>=4.3",
  "types-psutil>=7.0",  # psutil ships no py.typed; mypy --strict needs the stubs
  # dev only: test_ui_fonts.py builds the sdist and wheel in-process, offline
  # (M16-51, ADR-0012); the same pin as lab/core/build-constraints.txt, which a test checks
  "hatchling==1.33.0",
]
# Build-time only (ADR-0038): the release workflow freezes the released wheel
# into the macOS app (M17-08) with this group, installed into a clean virtual
# environment beside the wheel. Never a runtime dependency, never imported by
# wowlab_core, not installed by `uv sync` (only `dev` is a default group).
# tests/packaging/test_macos_app.py pins the version; a bump is a PR that says why.
packaging = [
  "pyinstaller==6.22.3",
]

# ─── ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude/worktrees", ".venv"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "UP",            # pyupgrade
  "B",             # bugbear
  "SIM",           # simplify
  "C4",            # comprehensions
  "PTH",           # pathlib over os.path
  "RUF",           # ruff-specific
  "N",             # naming
  "T20",           # no stray print() in library code
  "ERA",           # no commented-out code
  "DTZ",           # timezone-aware datetimes only (snapshot ids are UTC timestamps)
  "PLE2502",       # no raw bidirectional Unicode control character in source (M11-37)
]
ignore = [
  "E501",   # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Hook scripts talk to Claude Code over stdout; print is their interface.
".claude/hooks/*.py" = ["T20"]
# Tests may print diagnostics and use asserts freely.
"**/tests/**" = ["T20"]
# CI helper scripts report through stdout.
"scripts/*.py" = ["T20"]

# Hooks run under the system interpreter (as old as 3.9) in every contributor
# session, so pyupgrade must not modernise them past that.
[tool.ruff.per-file-target-version]
".claude/hooks/*.py" = "py39"
"tests/harness/*.py" = "py39"
# The root conftest.py is loaded by the hook tests under 3.9 too (M13-18).
"conftest.py" = "py39"
# make test-clean runs on the system python3, not under `uv run` (M13-81).
"scripts/clean_test_artifacts.py" = "py39"
# The smoke test's browser runs on whatever `python3` the runner's PATH has (M17-08).
"scripts/record_url.py" = "py39"

[tool.ruff.lint.isort]
known-first-party = ["wowlab_core"]
# `from conftest import …` in a suite (tests/scripts) means that suite's own
# conftest.py, which pytest puts on sys.path. The root conftest.py (M13-18)
# would otherwise make ruff sort `conftest` as first-party.
known-third-party = ["conftest"]

# ─── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
strict = true
python_version = "3.12"
# Scripts held to the library's standard: the scrub tool (the repository's privacy
# boundary), the subset tool (M12-01; makes fixtures the same byte-for-byte way),
# the command-reference generator (M12-13; its page is published to the wiki), and
# the wiki gate (M12-14; nothing should reach the wiki past it),
# and the release checks (M13-03; nothing is published past them), and the derived-fixture
# tool for the install's archives (M15-03; it reads the install and writes a fixture), and
# the font check (M16-51; it vouches for the third-party font files in the package),
# and the grader diff gate (M16-40; it holds graders of the load-bearing files to marker removal),
# and the test-artifact cleaner (M13-81; it deletes directories),
# and the frozen app's launcher and smoke test (M17-08; a release asset is built and checked with them).
files = [
  "lab/core/src",
  "scripts/lab_capture.py",
  "scripts/wago_subset.py",
  "scripts/gen_command_reference.py",
  "scripts/check_wiki.py",
  "scripts/release_check.py",
  "scripts/casc_facts.py",
  "scripts/check_fonts.py",
  "scripts/check_grader_diff.py",
  "scripts/clean_test_artifacts.py",
  "scripts/app_smoke.py",
  "scripts/record_url.py",
  "packaging/launcher.py",
]
exclude = ["\\.claude/worktrees", "\\.venv"]
warn_unreachable = true
pretty = true

# ─── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["lab/core/tests", "tests"]
norecursedirs = [".claude/worktrees", ".venv", "lab/core/tests/fixtures"]
addopts = "-m 'not live' --strict-markers -ra"
markers = [
  "parser: parser fixture and round-trip suites (make test-parser)",
  "live: hits a live external service; never runs in CI (ADR-0012)",
  "serial: measures RSS or a CPU-time budget; runs alone after the parallel pass (conftest.py, M13-18)",
]
# Hang guard (M13-81): a test still running after 300 s fails with every
# thread's stack, locally and in CI. The slowest measured test took 255 s
# (a lab-addon review probe, on 4 cores at load average about 20; M13-81),
# 45 s inside the guard;
# a test that needs longer gets an override by node id in conftest.py
# (TIMEOUT_OVERRIDES). The thread method works on Windows, and it leaves
# SIGALRM to the tests that use it (test_install_folder_race.py); on a
# timeout it ends the process, so xdist reports the worker crash and the
# test's stacks. The hook tests under Python 3.9 (`make hooks-test`) run
# without the plugin and warn that these two options are unknown.
timeout = 300
timeout_method = "thread"
# Keep a temp dir only for a failed test, and only from the last session
# (`make test-clean` removes the rest).
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
