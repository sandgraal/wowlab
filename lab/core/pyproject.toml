[project]
name = "wowlab-core"
version = "0.1.0"
description = "Local-only library and CLI over a World of Warcraft install"
requires-python = ">=3.12"
license = "Apache-2.0"
# All runtime dependencies from docs/LAB_PLAN.md §6 are present.
# Anything beyond that list needs a line in the PR body.
dependencies = [
  "psutil>=7.0",  # process listing only (ADR-0023); used by wowlab_core.process
  "pydantic>=2.11",
  "typer>=0.27,<0.28",  # cli.py imports typer._click (typer's vendored click, 0.26+); private, so bounded to the minor it was tested on
  "httpx>=0.28",
  "platformdirs>=4.3",
]

[project.scripts]
wowlab = "wowlab_core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wowlab_core"]

# The release sdist (M13-03, M13-14): the package, its build files and the
# repository's LICENSE, no test suite and nothing else in the folder (an
# untracked file under tests/ never ships). The wheel is built from this sdist,
# where hatchling's default license-files glob finds LICENSE, so the wheel
# carries it as dist-info/licenses/LICENSE with a License-File line in
# METADATA. The lab-addon ships inside the package: the sdist carries a copy of
# lab/addon/WowLab/ under the package, and the wheel built from the sdist picks
# it up through the `packages` rule above. addoninstall.find_source uses it
# whenever wowlab is not running from a checkout. scripts/release_check.py
# `dist` checks that both hold exactly the TOC and the .lua files it lists.
[tool.hatch.build.targets.sdist]
only-include = ["src", "pyproject.toml", "build-constraints.txt"]
exclude = ["/tests"]

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../addon/WowLab" = "src/wowlab_core/_addon/WowLab"
