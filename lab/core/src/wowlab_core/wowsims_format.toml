# What wowsims/forever's individual sim reads from its "Addon" import, for
# `wowlab char sim-export` (M21-08, `wowlab_core.simexport`).
#
# Read by hand from wowsims/forever, https://github.com/wowsims/forever, at
# commit 57df2a7a5a2bb085bfce15890a33d655bb7fd66f (2026-11-23, after v1.0.2).
# Nothing is fetched at run time; a newer sim is read again by hand and this
# file and `[source] commit` change together.
#
# The talent tables below are copied from that repository's
# `ui/sim/talents/trees/<class>.json` (each tree's `talents[].definitionId`,
# in the order listed), which is:
