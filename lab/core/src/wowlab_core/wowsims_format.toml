[source]
repository = "https://github.com/wowsims/forever"
commit = "57df2a7a5a2bb085bfce15890a33d655bb7fd66f"
# The files each table below was read from, at that commit.
read = [
    "ui/features/import-export/importers/addon.ts",
    "ui/features/import-export/importers/finish_individual_import.ts",
    "proto/common.proto",
    "ui/sim/proto/names.ts",
    "ui/sim/proto/database.ts",
    "ui/sim/talents/trees/<class>.json",
    "tools/database/dbc/random_suffix.go",
]

[format]
# `flavor` in the export: addon.ts applies the talent string only when it is
# this word (a string built for another game's trees would spend the points
# on other talents). It names the sim's format, not a client folder.
flavor = "forever"
# The sim's `ItemSlot` values 0 to 16 (proto/common.proto), in order, as the
# client's inventory slot numbers (the numbers `gear_slots.toml` names): Head,
# Neck, Shoulder, Back, Chest, Wrist, Hands, Waist, Legs, Feet, Finger 1,
# Finger 2, Trinket 1, Trinket 2, Main Hand, Off Hand, Ranged. A slot not in
# this list (the shirt, 4, and the tabard, 19) has no place in the sim.
slots = [1, 2, 3, 15, 5, 9, 10, 6, 7, 8, 11, 12, 13, 14, 16, 17, 18]

[races]
# The character's race id (a ChrRaces row id) = the sim's English race name
# (names.ts `raceNames`, matched by `nameToRace`). The ids are the
# ChrRaces rows of those names in the recorded 1.60.1.70058 table
# (lab/core/tests/fixtures/wago/ChrRaces.1.60.1.70058.csv); 95 and 96, the
# two Skyborne rows, are [verify] at later builds.
"1" = "Human"
"2" = "Orc"
"3" = "Dwarf"
"4" = "Night Elf"
"5" = "Undead"
"6" = "Tauren"
"7" = "Gnome"
"8" = "Troll"
"10" = "Blood Elf"
"95" = "High Order Skyborne"
"96" = "Windshaper Skyborne"

[classes]
# The character's class id (a ChrClasses row id) = the sim's class name. The
# sim's `Class` enum (proto/common.proto) numbers its classes by ChrClasses
# id; `nameToClass` reads these lower-case names.
"1" = "warrior"
"2" = "paladin"
"3" = "hunter"
"4" = "rogue"
"5" = "priest"
"7" = "shaman"
"8" = "mage"
"9" = "warlock"
"11" = "druid"

# Each class's three talent trees in the sim's order: digit i of tree t of the
# export's talent string is the rank of the TraitDefinition id at position i
# of tree t. The record holds trait entry ids; the game's TraitNodeEntry table
# (cached by `wowlab db2 fetch TraitNodeEntry`) gives each one's definition.
