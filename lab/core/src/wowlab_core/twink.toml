[planner]
# The "Plan on ForeverTwinking" address: origin and path, then
# ?class=<class word>&race=<race word>&bracket=l<cap>. The shape is from the
# owner's browser history (?class=warlock&race=undead&bracket=l29); the
# words for the other classes and races are [verify]. The origin must be
# link_sites.toml's ForeverTwinking site, the page's allowlist (M21-03): one
# a player's own twink.toml names elsewhere gets no link.
origin = "https://forevertwinking.com"
path = "/planner"

[planner.classes]
# The client's class token = the planner's word.
WARLOCK = "warlock"
MAGE = "mage"
PRIEST = "priest"
DRUID = "druid"
ROGUE = "rogue"
HUNTER = "hunter"
SHAMAN = "shaman"
PALADIN = "paladin"
WARRIOR = "warrior"

[planner.races]
# The character's race id (a ChrRaces row id) = the planner's word.
"1" = "human"
"2" = "orc"
"3" = "dwarf"
"4" = "nightelf"
"5" = "undead"
"6" = "tauren"
"7" = "gnome"
"8" = "troll"
