# Every outside site `wowlab` links to, and how each link's address is
# made (M21-03; ADR-0019's amendment of 2026-11-23). Read by
# `wowlab_core.links`.
#
# Data, not code. A link is an address the player's browser opens when, and
# only when, the player clicks it: wowlab itself requests nothing, fetches
# nothing and embeds nothing from any site here, and the page's CSP is the
# same as without this file. A link may carry a character's first and
# second name, region and guild name, and game ids (item, spell; a look's
# race, body type, class and barber-shop option and choice ids); never a
# path, the session key, an account folder name, an e-mail or a BattleTag.
#
# [sites] is also the page's allowlist of origins: the server sends every
# site's key and origin to the page with its list of commands, and the page
# draws an outside link only when its address is https:, its origin is
# exactly the origin of the site it names, it carries no user name or
# password, and the browser's URL parser writes it back unchanged. A site
# that is not here gets no link anywhere on the page.
#
# L6: nothing here names a flavor folder, a product code or a build. Which
# address a client version gets is the "room" of `dressing_sites.toml`'s
# band table (a 1.60 client's characters are in the "forever" room): a link
# with no template for the room gets no link, and says so.
#
# Every [links] template and every [pasted] shape has at least one
# [[example]] the tests rebuild byte for byte. `recorded` says where the
# address was seen; one that could not be opened is marked [verify].

[limits]
id = 2147483647  # item and spell ids are 32-bit in the client

# ─── the sites: key, name shown to the player, origin ───────────────────────

[sites.blizzard]
name = "Armory"
origin = "https://worldofwarcraft.blizzard.com"

[sites.wowhead]
name = "Wowhead"
origin = "https://www.wowhead.com"

[sites.journey]
name = "Journey Companion"
origin = "https://wofwforever.com"

[sites.raiderio]
name = "Raider.IO"
origin = "https://forever.raider.io"

[sites.warcraftlogs]
name = "Warcraft Logs"
origin = "https://forever.warcraftlogs.com"

[sites.keystone]
name = "Keystone.guru"
origin = "https://keystone.guru"

# Purist: an outfit builder on Wowhead's model viewer (M21-06). Its share
# link carries a whole look in the address's `#` part, which the browser
# never sends to the site: Purist's own script reads it in the page.
[sites.purist]
name = "Purist"
origin = "https://purist.pages.dev"

# ForeverTwinking: linked to only with an address the player pasted for one
# of their own characters (its addresses carry the site's own character
# number and server-made build codes, so none can be built; owner,
# 2026-11-23). wowlab never opens it.
[sites.forevertwinking]
name = "ForeverTwinking"
origin = "https://forevertwinking.com"

# Blizzard's armory pages, by region: the locale part of the address. A
# region not listed (cn) has no armory link. Only `us` was opened
# (2026-11-23); the other three are Blizzard's usual locales [verify].
[locales]
us = "en-us"
eu = "en-gb"
kr = "ko-kr"
tw = "zh-tw"

# A character's ruleset as Raider.IO's address names it, from either
# Raider.IO's own word or Blizzard's ruleset slug. Blizzard's armory gave
# `roleplay-pvp` for a character Raider.IO files under `pvp-rp` (both read
# 2026-11-23); Blizzard's other three slugs are [verify].
[rulesets]
normal = "normal"
pvp = "pvp"
rp = "rp"
pvp-rp = "pvp-rp"
roleplay = "rp"
roleplay-pvp = "pvp-rp"

# ─── how a name becomes part of an address ──────────────────────────────────
#
# A name is read as Unicode letters (NFC), with what each rule allows:
# `case` "lower" or "keep"; `spaces`, `apostrophes` and `hyphens` each
# "refuse" (the name gets no link), or the text that replaces it ("" drops it);
# `accents` (a letter past ASCII) "percent" (its UTF-8 bytes, %XX) or
# "refuse". Anything else in a name (a quote, `<`, `#`, `?`, `/`, a dot, a
# digit, a control or format character) gives no link. `max_length` counts
# characters. A space at either end, or two in a row, gives no link.

# Blizzard's character addresses are lowercase (`sandgraal-rizzen` for
# Sandgraal Rizzen; the capitalised form opens the same page). Accents
# [verify]: no accented Forever character was opened.
[slugs.armory_name]
case = "lower"
spaces = "refuse"
apostrophes = "refuse"
hyphens = "refuse"
accents = "percent"
max_length = 24

# A guild: lowercase, spaces become hyphens (`booty-bay-cartel` for Booty Bay
# Cartel, read 2026-11-23). Apostrophes dropped and accents [verify].
[slugs.armory_guild]
case = "lower"
spaces = "-"
apostrophes = ""
hyphens = "refuse"
accents = "percent"
max_length = 24

# The Journey Companion's form takes each name as typed, at most 24
# characters (its own `maxlength`).
[slugs.form_name]
case = "keep"
spaces = "refuse"
apostrophes = "refuse"
hyphens = "refuse"
accents = "percent"
max_length = 24

# Raider.IO names the character as the game spells it ("Sandgraal Rizzen";
# its own profile address for that character, read 2026-11-23).
[slugs.raiderio_name]
case = "keep"
spaces = "refuse"
apostrophes = "refuse"
hyphens = "refuse"
accents = "percent"
max_length = 24

# Keystone.guru's dungeons: lowercase, spaces become hyphens, apostrophes
# dropped (`the-deadmines`, `zulfarrak`; `zul-farrak` is not a page, read
# 2026-11-23).
[slugs.dungeon]
case = "lower"
spaces = "-"
apostrophes = ""
hyphens = "-"
accents = "refuse"
max_length = 64

# Purist's look names the character with letters and spaces only, as typed
# ("letters and spaces only; the browser encodes what it must",
# `/lib/look.js` line 34): a space is written `%20`, as the browser's
# address bar shows it.
[slugs.purist_name]
case = "keep"
spaces = "%20"
apostrophes = "refuse"
hyphens = "refuse"
accents = "percent"
max_length = 49

# ─── the links wowlab builds ────────────────────────────────────────────────
#
# Each: the site, the words the page shows (`label`), the kind (`profile`,
# `guild`, `item`, `spell`, `dungeon`), the regions it has pages for
# (absent: the link takes no region), the slug rule of each name it takes,
# and its address after the origin per room. Placeholders: `{region}`,
# `{locale}` (from [locales]), `{ruleset}` (from [rulesets]), `{id}`, and
# the names in `fields`.

[links.armory_character]
site = "blizzard"
label = "Armory"
kind = "profile"
regions = ["us", "eu", "kr", "tw"]
fields = { first = "armory_name", second = "armory_name" }
rooms = { forever = "/{locale}/forever/{region}/armory/character/{first}-{second}" }

[links.armory_guild]
site = "blizzard"
label = "Armory guild page"
kind = "guild"
regions = ["us", "eu", "kr", "tw"]
fields = { guild = "armory_guild" }
rooms = { forever = "/{locale}/forever/{region}/armory/guild/{guild}" }

[links.journey]
site = "journey"
label = "Journey Companion"
kind = "profile"
regions = ["us", "kr", "eu", "tw"]  # the form's own region list
fields = { first = "form_name", second = "form_name" }
rooms = { forever = "/en/tools/one-shot-manager/?region={region}&name={first}&surname={second}" }

[links.raiderio]
site = "raiderio"
label = "Raider.IO"
kind = "profile"
regions = ["us", "eu", "kr", "tw"]  # the site's own sitemaps list these four
fields = { first = "raiderio_name", second = "raiderio_name" }
rooms = { forever = "/characters/{region}/{ruleset}/{first}%20{second}" }

[links.wowhead_item]
site = "wowhead"
label = "Wowhead"
kind = "item"
rooms = { forever = "/forever/item={id}" }

[links.wowhead_spell]
site = "wowhead"
label = "Wowhead"
kind = "spell"
rooms = { forever = "/forever/spell={id}" }

[links.keystone_dungeon]
site = "keystone"
label = "Keystone.guru map"
kind = "dungeon"
fields = { dungeon = "dungeon" }
rooms = { forever = "/explore/forever/{dungeon}" }

# ─── a character's look on Purist (M21-06) ─────────────────────────────────
#
# Not a template: the address is the origin, `path`, `#`, then the hash
# Purist's `/lib/look.js` writes (`encode`, lines 9 and 33-47; read by the
# M21-06 agent on 2026-11-24 [verify on each Purist update]):
#
#   <format>|<name>|<race>.<sex>.<classic>.<sheathed>.<class>.<game>|<pets>|<option>:<choice>,…|<item>,…
#
# - format: 2 (line 34; `decode` reads a hash starting `2|` as this format,
#   line 66). Purist's share link is its page's address with this hash
#   (`/pages/index.js` line 2651), so `path` is `/`.
# - name: the label of the look; Purist names a character by it (the page's
#   `readHash`, `/pages/index.js` lines 2606-2641). Rule `purist_name`.
# - race: the game's race id (`/lib/races.js` lines 1 and 19); an id Purist
#   does not know falls back to its default, Human (look.js lines 28, 106).
# - sex: 0 male, 1 female (look.js line 130), `Enum.UnitSex` as the record's
#   identity gives it.
# - classic: 1, the classic models (line 35; its default, line 28).
# - sheathed: 0 weapons in hand, 1 sheathed, 2 the ranged weapon drawn
#   (line 14); 1, its default.
# - class: the game's class id (`/lib/races.js` line 20).
# - game: Purist's key for the game (`/lib/games.js` lines 7-10), by room.
#   The optional `.client` after it (line 11) is left off: a live character.
# - pets: companion, pet family and pet, `0.0.0` for none (lines 36, 79).
# - choices: the barber shop's option and choice ids (line 37); Purist writes
#   them in its object's key order, which for integer keys is ascending, so
#   wowlab sorts them by option to write the address Purist itself would.
#   `decode` drops a pair with a zero (line 80).
# - items: item ids (line 38), no bonus ids; Purist places each by its type
#   (`placeGear`, lines 168-190). Its own links list them by display slot
#   (`state.items`, keyed by display slot, `/pages/index.js` line 2809), so
#   wowlab writes them in that order too: `slots` maps the client's inventory
#   slot to Purist's display slot (`/lib/slots.js` lines 12-32); the neck,
#   rings and trinkets have none (no look) and are left out.
# - The glows, mount and tabard parts after the items (lines 39-45) are
#   written only when there is one, and wowlab has none to give.
#
# An empty customization or item part is read as none (lines 76 and 81), so
# a record without either still gets a link.

[look]
site = "purist"
label = "Purist"
path = "/"
format = 2
rooms = { forever = "forever" }
classic = 1
sheathed = 1
pets = "0.0.0"
name = "purist_name"
max_choices = 64
slots = { "1" = 1, "3" = 3, "4" = 4, "5" = 5, "6" = 6, "7" = 7, "8" = 8, "9" = 9, "10" = 10, "15" = 16, "16" = 21, "17" = 22, "18" = 15, "19" = 19 }

[[look.example]]
recorded = "[verify]: built from the owner's Sandgraal Rizzen (the macos-70888 fixture's identity, barber-shop record and gear, as the record lists them) by the format of Purist's look.js, read 2026-11-24; for the owner to open (M21-O2)"
version = "1.60.1.70888"
name = "Sandgraal Rizzen"
race_id = 5
sex = 0
class_id = 9
choices = [[58, 918], [59, 923], [60, 941], [61, 956], [563, 6287], [62, 980], [534, 5330]]
items = [[4, 4344], [5, 2578], [6, 14113], [7, 4309], [8, 6537], [9, 6543], [10, 6541], [15, 2580], [16, 2632], [17, 15970], [18, 11287]]
address = "https://purist.pages.dev/#2|Sandgraal%20Rizzen|5.0.1.1.9.forever|0.0.0|58:918,59:923,60:941,61:956,62:980,534:5330,563:6287|4344,2578,14113,4309,6537,6543,6541,11287,2580,2632,15970"

# ─── addresses the player pastes ────────────────────────────────────────────
#
# Each: the site, the kind, the words the page shows, and the path the
# address must have after the site's origin (a regular expression matched
# whole). `drop_after_path`: a `?` or `#` part is dropped rather than
# refused. `bare`: a code alone, without the address, is accepted too and
# put into `build`.

[pasted.forevertwinking_profile]
site = "forevertwinking"
kind = "profile"
label = "ForeverTwinking"
path = '/armory/[0-9]{1,10}-[a-z0-9]{1,32}(?:-[a-z0-9]{1,32}){0,7}'
drop_after_path = false

[pasted.forevertwinking_build]
site = "forevertwinking"
kind = "build"
label = "ForeverTwinking build"
path = '/builds/[A-Za-z0-9]{4,32}'
drop_after_path = false

[pasted.warcraftlogs_report]
site = "warcraftlogs"
kind = "report"
label = "Warcraft Logs report"
path = '/reports/[A-Za-z0-9]{16}'
drop_after_path = true
bare = '[A-Za-z0-9]{16}'
build = "/reports/{code}"

# ─── the examples ───────────────────────────────────────────────────────────
#
# `given` is what the builder is called with (`version` picks the room);
# `address` is what it must return, byte for byte.

[[example]]
link = "armory_character"
recorded = "2026-11-23: the page's own og:url, opened by the M21-03 agent; it shows Sandgraal Rizzen, a Forever US character of the owner's"
given = { first = "Sandgraal", second = "Rizzen", region = "us", version = "1.60.1.70888" }
address = "https://worldofwarcraft.blizzard.com/en-us/forever/us/armory/character/sandgraal-rizzen"

