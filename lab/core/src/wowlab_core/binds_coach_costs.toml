# Key costs for `wowlab binds coach` (docs/LAB_PLAN.md §15.2, M13-08).
#
# An opinion, not a fact: how hard a key is to reach in a fight, for a
# QWERTY keyboard with the left hand on W A S D and a mouse with two side
# buttons. Lower is easier. A key with modifiers costs its own cost plus each
# modifier's (CTRL-Q = Q + CTRL). The left and right forms of a modifier
# (LSHIFT, RCTRL, ...) cost what the modifier costs.
#
# To use your own: copy this file to `binds_coach_costs.toml` in wowlab's user
# config folder (`wowlab binds coach` prints both paths) and edit it. Each
# value you set replaces the one here; anything you leave out keeps its value
# from this file. Key names are written as the client writes them in the key
# bindings (`wowlab binds list` shows them); case does not matter.

[coach]
high_cost = 4             # a key costing this or more is a high-cost key
frequent_share = 0.05     # a spell is frequent at this share of your casts or more ...
frequent_min_casts = 5    # ... and at least this many casts
unlisted = 5              # the cost of a key not listed under [keys]

[modifiers]
SHIFT = 1
CTRL = 2
ALT = 2
META = 2

[keys]
# Under the fingers on W A S D, and the thumb buttons.
"1" = 1
"2" = 1
"3" = 1
"4" = 1
Q = 1
E = 1
R = 1
F = 1
W = 1
A = 1
S = 1
D = 1
BUTTON4 = 1
BUTTON5 = 1
# One short reach.
"5" = 2
T = 2
G = 2
Z = 2
X = 2
C = 2
V = 2
TAB = 2
SPACE = 2
BUTTON3 = 2
MOUSEWHEELUP = 2
MOUSEWHEELDOWN = 2
# A longer reach.
"6" = 3
Y = 3
H = 3
B = 3
"`" = 3
CAPSLOCK = 3
F1 = 3
F2 = 3
F3 = 3
F4 = 3
# Off the home position.
"7" = 4
U = 4
J = 4
N = 4
M = 4
F5 = 4
F6 = 4
# Anything not listed (8, 9, 0, the right hand's letters, F7 to F12, the
# number pad, arrows and the navigation keys) costs `unlisted`.
