# The file map: what every path in a World of Warcraft install is.
#
# This file is the single source of truth. `docs/LAB_FILE_MAP.md` carries a
# rendering of it between `<!-- filemap:begin <section> -->` and
# `<!-- filemap:end <section> -->` markers; regenerate with
#
#     uv run python scripts/gen_file_map.py --write
#
# and never edit those tables by hand. `lab/core/tests/test_filemap.py` fails
# when the two drift.
#
# Each `[[entry]]` is one table row. The display columns (`doc_path`, `what`,
# `notes`, `written_by`, `edit`, `tier`, `module`) are Markdown, rendered
# verbatim. `what` and `written_by` are a player's text: `explain`, `tree
# --explain` and the Explorer print them, so they name no ticket, decision,
# invariant, doc or module, use the game's words ("Battle.net app"), and say
# what is unknown in a player's terms, with at most one `**[verify]**`
# (M16-17). `notes` is the spec's: evidence, dates, open questions and
# pointers, rendered in the doc and carried in `--json` only; "—" when there
# is nothing to add.
# `match` and `exclude` are what `classify()` uses; they are never rendered.
# `catch_all = true` marks a row that names a folder's leftovers without
# describing them ("not described here yet"): `filemap gaps` lists what only
# such a row matches as a thin spot of the map (M13-22). Never rendered.
#
# Patterns are `/`-separated segments relative to `base`:
#   base = "root"    the install root (the folder holding `.build.info`)
#   base = "flavor"  a flavor folder, found by discovery, never by name (L6)
#   base = "any"     either, whichever the path is inside
# A segment is an fnmatch pattern compared case-insensitively, or one of:
#   **         zero or more segments
#   <digits>   a segment made only of ASCII digits
#   <name>     a segment that is not made only of ASCII digits
#   <executable>  a segment the write gate refuses as an executable: a name
#              ending, in any letter case, in one of `guard`'s executable
#              suffixes, or a versioned shared library (`libfoo.so.1`).
#              `filemap.py` holds a copy of `guard`'s rule; a test fails when
#              the two drift (M13-28)
#   .          the base folder itself (only as the whole pattern)
# A match pattern ending in `/` matches directories only; one ending in `**`
# matches anything; any other matches files only. `exclude` patterns match
# regardless of kind. A path that is not on disk is matched as a file unless
# it is written with a trailing `/` (M13-29): a folder row describes a folder
# that is there. Nothing here names a flavor, product, interface or build (L6).

[[section]]
id = "root"
title = "Install root"

[[section]]
id = "flavor"
title = "Flavor folder `<flavor>/`"

# ─── install root ────────────────────────────────────────────────────────────

[[entry]]
id = "build-info"
section = "root"
base = "root"
doc_path = "`.build.info`"
what = "Which game versions this install holds, with each one's version and build"
notes = "Installed products, versions, build keys: a pipe-separated table with `Name!TYPE:n` headers, one row per product"
written_by = "Battle.net app, on install and patch"
edit = "no"
tier = "A (read)"
module = "`install`"
match = [".build.info"]

[[entry]]
id = "agent-state"
section = "root"
base = "root"
doc_path = "`.product.db`, `.patch.result`, `Launcher.db`"
what = "Files the Battle.net app keeps for itself about this install; wowlab does not read them"
notes = "Battle.net app state; not parsed, contents not described here"
written_by = "Battle.net app"
edit = "no"
tier = "—"
module = "none"
match = [".product.db", ".patch.result", "Launcher.db"]

[[entry]]
id = "casc-data"
section = "root"
base = "root"
doc_path = "`Data/config/`, `Data/data/`, `Data/indices/`"
what = "The game's data store: build configs, data archives and their indexes. wowlab only reads it; a patch, or Scan and Repair in the Battle.net app, restores it"
notes = "CASC storage: build/CDN configs, archive blobs (`data.NNN`), index files (`*.idx`). Never edited: out of scope permanently (L7)"
written_by = "Battle.net app; the game streams into it"
edit = "no"
tier = "A (read)"
module = "`casc` (the build config, `Data/data/*.idx`, and one record's range of a `data.NNN` archive per read, read-only; never `shmem` or `index.lock.0`)"
match = [
  "Data/config/", "Data/config/**",
  "Data/data/", "Data/data/**",
  "Data/indices/", "Data/indices/**",
]

[[entry]]
id = "data-other"
section = "root"
base = "root"
doc_path = "`Data/`, anything under it not in the row above"
what = "Game data the Battle.net app keeps, shared by every game version installed here; wowlab never changes anything in it"
notes = "Shared by every flavor. Editing anything under `Data/` is out of scope permanently (LAB_PLAN L7)"
written_by = "Battle.net app; the game streams into it"
edit = "no"
tier = "—"
module = "none"
match = ["Data/", "Data/**"]

[[entry]]
id = "launcher"
section = "root"
base = "root"
doc_path = "`World of Warcraft Launcher.exe` / `.app`"
what = "The game's launcher, which opens the Battle.net app"
notes = "—"
written_by = "Battle.net app"
edit = "no"
tier = "—"
module = "none"
match = [
  "World of Warcraft Launcher.exe",
  "World of Warcraft Launcher.app/", "World of Warcraft Launcher.app/**",
]

[[entry]]
id = "os-metadata"
section = "root"
base = "any"
doc_path = "`.DS_Store`, `._*`, `Thumbs.db`, `desktop.ini` (anywhere)"
what = "Files your computer's operating system leaves beside the game's files (folder view settings, thumbnail caches, macOS attribute copies); not the game's"
notes = "`._*` are macOS AppleDouble files on volumes without extended attributes **[verify]**. `layout` lists them apart from everything else"
written_by = "Finder (macOS), File Explorer (Windows)"
edit = "no"
tier = "—"
module = "none"
match = ["**/.DS_Store", "**/._*", "**/Thumbs.db", "**/desktop.ini"]

