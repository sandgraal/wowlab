# The field layouts `hotfix` decodes the hotfix cache's rows with (M22-23).
#
# A row in the client's hotfix cache (Cache/ADB/<locale>/DBCache.bin) is not
# bit-packed: its fields are byte-aligned little-endian values in the table's
# field order, at their declared widths, strings inline and ending in a zero
# byte, and the row's ID is not in it (the record header carries it). The
# order and widths below were read by hand from WoWDBDefs
# (https://github.com/wowdev/WoWDBDefs, `definitions/Item.dbd` layout
# 9A2A4834 and `definitions/ItemSparse.dbd` layout 6FCC3191, 2026-11-23);
# wowsims/forever (MIT) `tools/db2tool/wdc/hotfix.go` decodes the same way.
#
# No build is named here (L6). A layout is used for a build only when the
# names, in order, are exactly the columns of that build's own copy of the
# table after `ID` (arrays as <name>_0, <name>_1, ...), and only when every
# row decodes to its record's exact length; otherwise the overlay is refused
# with the reason.
#
# A field is "<name>:<type>" or "<name>:<type>:<count>" for an array. Types:
# i8 u8 i16 u16 i32 u32 f32 (little-endian), str (UTF-8, ends in a zero byte).

[tables.Item]
fields = [
  "ClassID:i32",
  "SubclassID:u8",
  "Material:u8",
  "InventoryType:i8",
  "SheatheType:u8",
  "ItemPetFoodID:i32",
  "Sound_override_subclassID:i8",
  "IconFileDataID:i32",
  "ItemGroupSoundsID:u32",
  "ContentTuningID:i32",
  "ModifiedCraftingReagentItemID:i32",
  "AmmunitionType:u8",
  "CraftingQualityID:i32",
  "ItemSquishEraID:i32",
  "RecraftReagentCountPercentage:f32",
  "OrderSource:u8",
]

