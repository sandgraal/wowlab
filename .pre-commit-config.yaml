# Local gate. CI runs the same tools; this just fails earlier.
# Wired by `make setup` through the tracked .githooks/pre-commit and
# core.hooksPath — do not run `pre-commit install` (see docs/AGENT_WORKFLOW.md).
repos:
  # Keep in step with the ruff pin in pyproject.toml / uv.lock: Dependabot
  # bumps those, nothing bumps this rev.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.12
    hooks:
      - id: uv-lock
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Real captures are stored byte for byte; only their index is normalised.
      - id: trailing-whitespace
        exclude: '^lab/core/tests/fixtures/|\.md$'
      - id: end-of-file-fixer
        exclude: '^lab/core/tests/fixtures/(?!README\.md$)'
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      # 512 KB everywhere; real captures may be larger (M10-03 asks for one
      # multi-MB SavedVariables file, and a fixture is never trimmed to fit),
      # so fixtures get their own 16 MB ceiling instead of no ceiling.
      - id: check-added-large-files
        args: [--maxkb=512, --enforce-all]
        exclude: '^lab/core/tests/fixtures/'
      - id: check-added-large-files
        name: check for added large files (fixtures, 16 MB)
        args: [--maxkb=16384, --enforce-all]
        files: '^lab/core/tests/fixtures/'
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        # Scan inside compressed fixtures too (same flag as the CI job).
        args: [--max-archive-depth=1]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
